<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التشغيلات</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f6fa;color:#172033}header{background:#18243a;color:#fff;padding:15px 22px;display:flex;justify-content:space-between}.wrap{max-width:1400px;margin:18px auto;padding:0 14px}.topbar{background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 2px 12px #0001;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}.back{background:#18243a;color:#fff;border:0;border-radius:9px;padding:10px 16px;cursor:pointer;font-size:14px}.frame{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px #0001}iframe{width:100%;height:700px;border:0;display:block}</style></head><body><header><b>📦 نظام إدارة المخزون والمحاسبة</b><span>قسم التشغيلات</span></header><main class="wrap"><div class="topbar"><button class="back" onclick="goBack()">↩ رجوع للشاشة السابقة</button><b>🏷️ التشغيلات</b></div><div class="frame"><iframe id="f" src="index.html?module=lots" title="التشغيلات"></iframe></div></main><script>function goBack(){if(history.length>1)history.back();else location.href='accounting.html'}f.onload=()=>{try{let d=f.contentDocument,s=d.createElement('style');s.textContent='header,#moduleBar,#app>.card:first-of-type,#app>.grid,.nav,#dash,#purchases,#sales,#items,#warehouse,#opening,#moves,#accounts,#journal,#reports,#sites,#parties{display:none!important}#app{display:block!important}#lots{display:block!important;margin:0!important}main#app{max-width:none!important;margin:0!important;padding:0!important}body{background:transparent!important}';d.head.appendChild(s)}catch(e){}};</script></body></html>
