<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كشف حساب الخزائن والبنوك</title><style>*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f4f6fa;margin:0;color:#172033}header{background:#18243a;color:#fff;padding:17px 24px;display:flex;justify-content:space-between}main{max-width:1200px;margin:22px auto;padding:0 15px}.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 2px 14px #0001;margin-bottom:16px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:bold;color:#475467}select,input{padding:11px;border:1px solid #d5dbe6;border-radius:9px;font-family:inherit}button,a{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;text-decoration:none;background:#18243a;color:#fff;font-family:inherit}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.box{border:1px solid #e4e7ec;border-radius:12px;padding:14px}.box small{color:#667085}.num{font-size:20px;font-weight:bold;margin-top:7px}.green{color:#087443}.red{color:#b42318}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:11px;border-bottom:1px solid #edf0f5;text-align:right;white-space:nowrap}th{background:#eef2f7}.empty{text-align:center;color:#667085;padding:20px}.hint{font-size:12px;color:#667085;margin-top:10px}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:550px){.filters,.summary{grid-template-columns:1fr}}</style></head><body><header><b>📒 كشف حساب الخزائن والبنوك</b><span>حركة الحساب والرصيد</span></header><main><div class="card"><h2 style="margin-top:0">كشف الحساب</h2><div class="filters"><div class="field"><label>الخزينة / البنك</label><select id="account"></select></div><div class="field"><label>من تاريخ</label><input id="from" type="date"></div><div class="field"><label>إلى تاريخ</label><input id="to" type="date"></div><button onclick="load()">عرض</button></div><div class="hint">يعرض الرصيد الافتتاحي والحركات المرحّلة فقط. المسودات لا تؤثر على الرصيد.</div></div><div class="summary"><div class="box"><small>الرصيد الافتتاحي</small><div id="opening" class="num">0.00</div></div><div class="box"><small>إجمالي المقبوض</small><div id="receipts" class="num green">0.00</div></div><div class="box"><small>إجمالي المدفوع</small><div id="payments" class="num red">0.00</div></div><div class="box"><small>الرصيد الحالي</small><div id="balance" class="num">0.00</div></div></div><div class="card"><h3 style="margin-top:0">تفاصيل الحركة</h3><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>النوع</th><th>وارد</th><th>منصرف</th><th>الرصيد</th></tr></thead><tbody id="rows"></tbody></table></div></div><a href="cash-banks.html">🏦 الخزائن والبنوك</a> <a href="accounting.html">← الرئيسية</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient('https://fyqyodnboryzaejlhdlk.supabase.co','sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2');const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let accounts=[];
async function init(){const r=await sb.from('finance_accounts').select('id,name_ar,code,opening_balance').eq('active',true).order('code');if(r.error){rows.innerHTML='<tr><td colspan="6">'+esc(r.error.message)+'</td></tr>';return}accounts=r.data||[];account.innerHTML=accounts.map(x=>'<option value="'+x.id+'">'+esc(x.name_ar)+'</option>').join('');from.value='2026-09-01';to.value='2026-09-30';load()}
async function load(){const a=accounts.find(x=>x.id===account.value);if(!a)return;const start=from.value,end=to.value;opening.textContent=fmt(a.opening_balance);let [tr,ft]=await Promise.all([sb.from('finance_transactions').select('transaction_date,transaction_type,amount,notes').eq('finance_account_id',a.id).eq('posted',true).gte('transaction_date',start).lte('transaction_date',end).order('transaction_date'),sb.from('finance_transfers').select('transfer_date,from_account_id,to_account_id,amount,notes').eq('posted',true).or('from_account_id.eq.'+a.id+',to_account_id.eq.'+a.id).gte('transfer_date',start).lte('transfer_date',end).order('transfer_date')]);if(tr.error||ft.error){rows.innerHTML='<tr><td colspan="6">'+esc((tr.error||ft.error).message)+'</td></tr>';return}let movements=[];for(const x of tr.data||[])movements.push({date:x.transaction_date,note:x.notes||'',type:x.transaction_type,in:x.transaction_type==='receipt'?Number(x.amount):0,out:x.transaction_type==='payment'?Number(x.amount):0});for(const x of ft.data||[]){const incoming=x.to_account_id===a.id;movements.push({date:x.transfer_date,note:x.notes||'تحويل داخلي',type:incoming?'transfer_in':'transfer_out',in:incoming?Number(x.amount):0,out:incoming?0:Number(x.amount)})}movements.sort((x,y)=>x.date.localeCompare(y.date));let bal=Number(a.opening_balance||0),ins=0,outs=0;rows.innerHTML=movements.map(x=>{ins+=x.in;outs+=x.out;bal+=x.in-x.out;const typ=x.type==='receipt'?'قبض':x.type==='payment'?'صرف':x.type==='transfer_in'?'تحويل وارد':'تحويل صادر';return '<tr><td>'+esc(x.date)+'</td><td>'+esc(x.note)+'</td><td>'+typ+'</td><td class="green">'+(x.in?fmt(x.in):'—')+'</td><td class="red">'+(x.out?fmt(x.out):'—')+'</td><td>'+fmt(bal)+'</td></tr>'}).join('')||'<tr><td colspan="6" class="empty">لا توجد حركات مرحّلة في الفترة.</td></tr>';receipts.textContent=fmt(ins);payments.textContent=fmt(outs);balance.textContent=fmt(bal)}
init();
</script></body></html>
