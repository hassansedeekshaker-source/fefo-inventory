<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ترحيل المبيعات</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fb;font-family:Tahoma,Arial;color:#172033}.wrap{width:100%;padding:14px}.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btn,button{padding:9px 14px;border:1px solid #d7dee8;border-radius:7px;background:#fff;color:#172033;text-decoration:none;cursor:pointer}.card{background:#fff;border:1px solid #dfe5ed;border-radius:8px;padding:14px}.title{display:flex;justify-content:space-between;align-items:center}.title h1{margin:0 0 14px;font-size:28px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #dfe5ed;padding:9px;text-align:center}th{background:#eef2f7}.ok{background:#087f4f;color:#fff}.post{background:#18243a;color:#fff}.msg{margin-top:12px;padding:10px;border-radius:7px}.good{background:#e7f7ee;color:#087f4f}.bad{background:#fdecec;color:#b42318}</style></head><body><div class="wrap"><div class="top"><a class="btn" href="accounting.html">🏠 الرئيسية</a><a class="btn" href="sales.html">↩ المبيعات</a><a class="btn" href="sales-saved.html">📋 المحفوظة</a><a class="btn" href="sale-post.html">📤 الترحيل</a></div><div class="card"><div class="title"><h1>ترحيل المبيعات</h1><button onclick="load()">🔄 تحديث</button></div><p>المستندات هنا مسودات فقط. لا تؤثر على المخزون أو الحسابات حتى الترحيل.</p><table><thead><tr><th>تحديد</th><th>الرقم</th><th>التاريخ</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody id="rows"></tbody></table><div class="actions" style="margin-top:12px"><button class="post" onclick="postSelected()">📤 ترحيل المحدد</button></div><div id="msg"></div></div></div><script>
var API='https://fyqyodnboryzaejlhdlk.supabase.co/rest/v1',KEY='sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2';
function token(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('sb-fyqyodnboryzaejlhdlk-auth-token')===0){var x=JSON.parse(localStorage.getItem(k));return x.access_token||(x.currentSession&&x.currentSession.access_token)||''}}}catch(e){}return ''}
function req(path,method,body,prefer){return new Promise(function(res,rej){var x=new XMLHttpRequest();x.open(method||'GET',API+'/'+path,true);x.setRequestHeader('apikey',KEY);x.setRequestHeader('Authorization','Bearer '+(token()||KEY));if(body){x.setRequestHeader('Content-Type','application/json');if(prefer)x.setRequestHeader('Prefer',prefer)}x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status>=200&&x.status<300){var d=x.responseText?JSON.parse(x.responseText):null;res(d)}else rej(new Error(x.status+' '+x.responseText))};x.send(body?JSON.stringify(body):null)})}
function show(s,c){document.getElementById('msg').className='msg '+c;document.getElementById('msg').textContent=s}
async function load(){try{var a=await req('sales?select=*&status=eq.draft&order=sale_date.desc');document.getElementById('rows').innerHTML=(a||[]).map(function(x){return '<tr><td><input type="checkbox" class="ck" value="'+x.id+'"></td><td>'+String(x.invoice_no||x.id.slice(0,8))+'</td><td>'+String(x.sale_date||'')+'</td><td>'+Number(x.total||0).toFixed(2)+'</td><td>مسودة</td></tr>'}).join('')||'<tr><td colspan="5">لا توجد مسودات.</td></tr>'}catch(e){show(e.message,'bad')}}
async function account(code){var a=await req('coa_accounts?code=eq.'+encodeURIComponent(code)+'&select=*&limit=1');if(!a[0])throw Error('الحساب '+code+' غير موجود');return a[0]}
async function journal(source,id,date,desc,lines){var e=await req('journal_entries','POST',{entry_date:date,source_type:source,source_id:id,description:desc,posted:true,created_by:userId()},'return=representation');await req('journal_lines','POST',lines.map(function(x){x.entry_id=e[0].id;return x}))}
function userId(){try{var p=token().split('.')[1];return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/'))).sub}catch(e){return null}}
async function postSelected(){var ids=[].slice.call(document.querySelectorAll('.ck:checked')).map(function(x){return x.value});if(!ids.length)return show('حدد مستندًا واحدًا على الأقل','bad');try{for(var i=0;i<ids.length;i++)await postOne(ids[i]);show('تم الترحيل بنجاح وتحديث المخزون والقيود المحاسبية ✓','good');load()}catch(e){show(e.message||e,'bad')}}
async function postOne(id){
var result=await req('rpc/post_sale_atomic','POST',{p_sale_id:id,p_created_by:userId()});
if(!result||result.success!==true)throw Error('لم يؤكد النظام اكتمال ترحيل فاتورة المبيعات؛ راجع حالة المستند قبل إعادة المحاولة.');
}
</script></body></html>
