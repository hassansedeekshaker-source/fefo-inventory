<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحويل بين الخزائن والبنوك</title><style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f4f6fa;margin:0;color:#172033}header{background:#18243a;color:#fff;padding:17px 24px;display:flex;justify-content:space-between;align-items:center}main{max-width:1180px;margin:22px auto;padding:0 15px}.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 2px 14px #0001;margin-bottom:16px}h2{margin:0 0 18px}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:bold;color:#475467}input,select{width:100%;padding:11px 12px;border:1px solid #d5dbe6;border-radius:9px;font-family:inherit;font-size:14px;background:#fff}input:focus,select:focus{outline:2px solid #d9e5ff;border-color:#5b8def}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button,a{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;text-decoration:none;background:#18243a;color:#fff;font-family:inherit;font-size:14px}button.primary{background:#087443}.msg{margin-top:15px;padding:12px;border-radius:9px;background:#f5f7fa;color:#475467}.hint{font-size:12px;color:#667085;margin-top:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:11px;border-bottom:1px solid #edf0f5;text-align:right;white-space:nowrap}th{background:#eef2f7;font-size:13px}.draft{color:#b54708;font-weight:bold}.posted{color:#087443;font-weight:bold}.empty{text-align:center;color:#667085;padding:20px}@media(max-width:900px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.form-grid{grid-template-columns:1fr}header{padding:14px}.card{padding:15px}}</style></head><body><header><b>🔄 التحويل بين الخزائن والبنوك</b><span>تحويل داخلي</span></header><main>
<div class="card"><h2>تحويل مالي داخلي</h2><div class="form-grid">
<div class="field"><label>التاريخ</label><input id="date" type="date"></div>
<div class="field"><label>من حساب</label><select id="from"></select></div>
<div class="field"><label>إلى حساب</label><select id="to"></select></div>
<div class="field"><label>المبلغ</label><input id="amount" type="number" step="0.01" min="0.01" placeholder="0.00"></div>
<div class="field"><label>البيان</label><input id="notes" placeholder="مثال: تحويل من بنك مصر إلى CIB"></div>
</div><div class="hint">التحويل الداخلي لا يعتبر إيرادًا أو مصروفًا؛ عند الترحيل يزيد الحساب المستلم ويخفض الحساب المحول منه فقط.</div>
<div class="actions"><button class="primary" onclick="save()">💾 حفظ كمسودة</button><a href="cash-banks.html">🏦 الخزائن والبنوك</a><a href="accounting.html">← الرئيسية</a></div>
<div id="msg" class="msg">المسودة لا تغيّر الأرصدة حتى يتم ترحيلها.</div></div>
<div class="card"><h3 style="margin-top:0">آخر التحويلات</h3><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>من</th><th>إلى</th><th>المبلغ</th><th>الحالة</th><th>البيان</th></tr></thead><tbody id="list"></tbody></table></div></div>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient('https://fyqyodnboryzaejlhdlk.supabase.co','sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));$('date').value='2026-09-01';let accounts=[];
async function init(){const r=await sb.from('finance_accounts').select('id,name_ar,code').eq('active',true).order('code');if(r.error){$('msg').textContent='تعذر تحميل الحسابات: '+r.error.message;return}accounts=r.data||[];const opts=accounts.map(x=>'<option value="'+x.id+'">'+esc(x.name_ar)+'</option>').join('');$('from').innerHTML=opts;$('to').innerHTML=opts;loadList()}
async function save(){const from=$('from').value,to=$('to').value,amount=Number($('amount').value);if(!from||!to||from===to)return $('msg').textContent='اختر حسابين مختلفين للتحويل.';if(!amount||amount<=0)return $('msg').textContent='اكتب مبلغ صحيح.';const r=await sb.from('finance_transfers').insert({transfer_date:$('date').value,from_account_id:from,to_account_id:to,amount,notes:$('notes').value||null,posted:false});if(r.error)return $('msg').textContent='خطأ: '+r.error.message;$('msg').textContent='تم حفظ التحويل كمسودة بنجاح. لن يتغير أي رصيد حتى الترحيل.';$('amount').value='';$('notes').value='';loadList()}
async function loadList(){const r=await sb.from('finance_transfers').select('transfer_date,amount,posted,notes,from_account_id,to_account_id').order('created_at',{ascending:false}).limit(30);if(r.error){$('list').innerHTML='<tr><td colspan="6">'+esc(r.error.message)+'</td></tr>';return}const amap=Object.fromEntries(accounts.map(x=>[x.id,x.name_ar]));$('list').innerHTML=(r.data||[]).map(x=>'<tr><td>'+esc(x.transfer_date)+'</td><td>'+esc(amap[x.from_account_id]||'')+'</td><td>'+esc(amap[x.to_account_id]||'')+'</td><td>'+Number(x.amount).toLocaleString('ar-EG',{minimumFractionDigits:2})+'</td><td class="'+(x.posted?'posted':'draft')+'">'+(x.posted?'مرحل':'مسودة')+'</td><td>'+esc(x.notes||'')+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">لا توجد تحويلات.</td></tr>'}init();
</script><script src="keyboard-nav.js"></script></body></html>
