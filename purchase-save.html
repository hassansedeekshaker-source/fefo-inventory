<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حفظ المشتريات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;color:#17233b}
#app{width:min(1400px,96%);margin:22px auto}
.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 3px 16px #0001}
.top{display:flex;gap:10px;margin-bottom:14px;align-items:center;justify-content:flex-start}
.top a,.btn,button{border:0;border-radius:9px;padding:10px 16px;background:#e8edf5;color:#17233b;text-decoration:none;cursor:pointer;white-space:nowrap}
.top a:first-child,.ok{background:#087f4f;color:#fff}
.head{display:grid;grid-template-columns:1.1fr 1.1fr 1.1fr 1.1fr;gap:14px;margin:18px 0}
label{display:flex;flex-direction:column;gap:6px;font-weight:600}
input,select{width:100%;min-width:0;padding:10px 11px;border:1px solid #ccd5e3;border-radius:8px;background:#fff;font-size:14px}
table{width:100%;border-collapse:separate;border-spacing:0;margin:18px 0;font-size:13px;table-layout:fixed}
th,td{padding:8px 6px;border-bottom:1px solid #e5e9f0;text-align:center;vertical-align:middle;overflow:hidden}
th{background:#eef2f7;font-weight:700;line-height:1.35}
td select,td input{font-size:13px;padding:8px 6px}
table th:nth-child(1),table td:nth-child(1){width:18%}
table th:nth-child(2),table td:nth-child(2){width:8%}
table th:nth-child(3),table td:nth-child(3){width:9%}
table th:nth-child(4),table td:nth-child(4){width:10%}
table th:nth-child(5),table td:nth-child(5){width:11%}
table th:nth-child(6),table td:nth-child(6){width:9%}
table th:nth-child(7),table td:nth-child(7){width:10%}
table th:nth-child(8),table td:nth-child(8){width:9%}
table th:nth-child(9),table td:nth-child(9){width:9%}
table th:nth-child(10),table td:nth-child(10){width:7%}
#invoiceSummary{display:grid!important;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px!important}
#invoiceSummary .card{padding:15px 18px;text-align:center;border:1px solid #e6eaf0;box-shadow:0 2px 10px #0000000d}
#invoiceSummary b{display:block;font-size:14px;margin-bottom:6px}
#invoiceValue,#invoiceTax,#invoiceTotal{font-size:22px;font-weight:700}
.msg{padding:12px;margin-top:14px;border-radius:8px}.msg.ok{background:#e5f7ee;color:#087f4f}.msg.bad{background:#fdecec;color:#b42318}
.new-movement{font-weight:600}
@media(max-width:1100px){#app{width:98%}.card{padding:16px}table{font-size:12px}th,td{padding:6px 4px}td input,td select{font-size:12px;padding:7px 4px}}
@media(max-width:800px){.head{grid-template-columns:1fr 1fr}#invoiceSummary{grid-template-columns:1fr}.top{flex-wrap:wrap}}
</style></head><body data-workflow="purchase-save"><main id="app"></main><script>window.onerror=function(m,s,l,c,e){document.getElementById("app").innerHTML="<div style=\"font-family:Arial;padding:40px;direction:rtl\"><h2>حدث خطأ في تحميل الشاشة</h2><p>"+String(m)+"</p><a href=\"accounting.html\">🏠 العودة للرئيسية</a></div>"};</script><script src="workflow.js?v=20260831-1905"></script></body></html>
