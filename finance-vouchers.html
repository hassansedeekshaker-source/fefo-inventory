<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>القبض والصرف</title><style>body{font-family:Tahoma,Arial;background:#f4f6fa;margin:0;color:#172033}header{background:#18243a;color:#fff;padding:18px}main{max-width:1200px;margin:20px auto;padding:0 15px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 12px #0001;margin-bottom:15px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}label{display:block;font-size:13px;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d6dce8;border-radius:8px;font-family:inherit}textarea{min-height:70px}button,a{border:0;border-radius:9px;padding:10px 15px;cursor:pointer;text-decoration:none;background:#18243a;color:#fff;margin:4px}.receipt{border-right:5px solid #087443}.payment{border-right:5px solid #b42318}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #edf0f5;text-align:right}th{background:#eef2f7}.msg{padding:10px;border-radius:8px;background:#f7f8fa}@media(max-width:800px){.row{grid-template-columns:1fr 1fr}}@media(max-width:500px){.row{grid-template-columns:1fr}}</style></head><body><header><b>💵 القبض والصرف</b></header><main><div class="card"><h2>إيصال قبض / سند صرف</h2><div class="row"><div><label>نوع الحركة</label><select id="type"><option value="receipt">قبض</option><option value="payment">صرف</option></select></div><div><label>التاريخ</label><input id="date" type="date"></div><div><label>الخزينة / البنك</label><select id="account"></select></div><div><label>نوع الطرف</label><select id="partyType"><option value="customer">عميل</option><option value="supplier">مورد</option><option value="other">أخرى</option></select></div></div><div class="row" style="margin-top:10px"><div><label>الطرف</label><select id="party"><option value="">اختر الطرف</option></select></div><div><label>المبلغ</label><input id="amount" type="number" step="0.01" min="0.01"></div><div><label>رقم المرجع</label><input id="ref"></div><div><label>البيان</label><input id="notes"></div></div><button onclick="save()">💾 حفظ كمسودة</button><a href="cash-banks.html">🏦 الخزائن والبنوك</a><a href="accounting.html">← الرئيسية</a><div id="msg" class="msg">الحركات المحفوظة هنا مسودات، ولن تؤثر على الحسابات حتى يتم ترحيلها.</div></div><div class="card"><h3>آخر الحركات</h3><table><thead><tr><th>رقم</th><th>التاريخ</th><th>النوع</th><th>الحساب</th><th>الطرف</th><th>المبلغ</th><th>البيان</th></tr></thead><tbody id="list"></tbody></table></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const sb=supabase.createClient('https://fyqyodnboryzaejlhdlk.supabase.co','sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));$('date').value='2026-09-01';let accounts=[],customers=[],suppliers=[];async function init(){let [a,c,s]=await Promise.all([sb.from('finance_accounts').select('id,name_ar,code').eq('active',true).order('code'),sb.from('customers').select('id,code,name_ar').order('code'),sb.from('suppliers').select('id,code,name_ar').order('code')]);if(a.error){$('msg').textContent=a.error.message;return}accounts=a.data||[];customers=c.data||[];suppliers=s.data||[];$('account').innerHTML=accounts.map(x=>'<option value="'+x.id+'">'+esc(x.name_ar)+'</option>').join('');partyChange();loadList()}function partyChange(){const t=$('partyType').value;if(t==='customer')$('party').innerHTML='<option value="">اختر العميل</option>'+customers.map(x=>'<option value="'+x.id+'">'+esc(x.code)+' - '+esc(x.name_ar)+'</option>').join('');else if(t==='supplier')$('party').innerHTML='<option value="">اختر المورد</option>'+suppliers.map(x=>'<option value="'+x.id+'">'+esc(x.code)+' - '+esc(x.name_ar)+'</option>').join('');else $('party').innerHTML='<option value="">بدون طرف</option>'} $('partyType').onchange=partyChange;async function save(){const amount=Number($('amount').value);if(!amount||amount<=0)return $('msg').textContent='اكتب مبلغ صحيح.';const t=$('partyType').value,p=$('party').value;let q=await sb.from('finance_transactions').select('transaction_no').order('transaction_no',{ascending:false}).limit(1);let no=q.data?.[0]?.transaction_no?Number(q.data[0].transaction_no)+1:1;let row={transaction_no:no,transaction_date:$('date').value,finance_account_id:$('account').value,transaction_type:$('type').value,party_type:t,amount,reference_no:$('ref').value||null,notes:$('notes').value||null};if(t==='customer')row.customer_id=p||null;if(t==='supplier')row.supplier_id=p||null;const r=await sb.from('finance_transactions').insert(row);if(r.error)return $('msg').textContent='خطأ: '+r.error.message;$('msg').textContent='تم حفظ الحركة كمسودة رقم '+no+'.';$('amount').value='';$('ref').value='';$('notes').value='';loadList()}async function loadList(){const r=await sb.from('finance_transactions').select('transaction_no,transaction_date,transaction_type,amount,notes,finance_accounts(name_ar),customers(name_ar),suppliers(name_ar)').order('transaction_no',{ascending:false}).limit(30);if(r.error){$('list').innerHTML='<tr><td colspan="7">'+esc(r.error.message)+'</td></tr>';return}$('list').innerHTML=(r.data||[]).map(x=>'<tr><td>'+esc(x.transaction_no)+'</td><td>'+esc(x.transaction_date)+'</td><td>'+(x.transaction_type==='receipt'?'قبض':'صرف')+'</td><td>'+esc(x.finance_accounts?.name_ar)+'</td><td>'+esc(x.customers?.name_ar||x.suppliers?.name_ar||'—')+'</td><td>'+Number(x.amount).toLocaleString('ar-EG',{minimumFractionDigits:2})+'</td><td>'+esc(x.notes||'')+'</td></tr>').join('')||'<tr><td colspan="7">لا توجد حركات.</td></tr>'}init();</script></body></html>
