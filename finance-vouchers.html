<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>القبض والصرف</title><style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f4f6fa;margin:0;color:#172033}header{background:#18243a;color:#fff;padding:17px 24px;display:flex;justify-content:space-between;align-items:center}header b{font-size:18px}main{max-width:1180px;margin:22px auto;padding:0 15px}.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 2px 14px #0001;margin-bottom:16px}h2{margin:0 0 18px}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:bold;color:#475467}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d5dbe6;border-radius:9px;font-family:inherit;font-size:14px;background:#fff}input:focus,select:focus,textarea:focus{outline:2px solid #d9e5ff;border-color:#5b8def}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button,a{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;text-decoration:none;background:#18243a;color:#fff;font-family:inherit;font-size:14px}button.primary{background:#087443}.msg{margin-top:15px;padding:12px;border-radius:9px;background:#f5f7fa;color:#475467}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px;border-bottom:1px solid #edf0f5;text-align:right;white-space:nowrap}th{background:#eef2f7;font-size:13px}.type-receipt{color:#087443;font-weight:bold}.type-payment{color:#b42318;font-weight:bold}.empty{text-align:center;color:#667085;padding:20px}.note{font-size:12px;color:#667085;margin-top:7px}@media(max-width:900px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.form-grid{grid-template-columns:1fr}header{padding:14px}.card{padding:15px}}</style></head><body><header><b>💵 القبض والصرف</b><span>الحركات المالية</span></header><main>
<div class="card"><h2>إيصال قبض / سند صرف</h2>
<div class="form-grid">
<div class="field"><label>نوع الحركة</label><select id="type"><option value="receipt">قبض</option><option value="payment">صرف</option></select></div>
<div class="field"><label>التاريخ</label><input id="date" type="date"></div>
<div class="field"><label>الخزينة / البنك</label><select id="account"></select></div>
<div class="field"><label>نوع الطرف</label><select id="partyType"><option value="customer">عميل</option><option value="supplier">مورد</option><option value="other">أخرى</option></select></div>
<div class="field"><label>الطرف</label><input id="party" list="partyList" placeholder="اكتب للبحث عن الطرف"><datalist id="partyList"></datalist></div>
<div class="field"><label>المبلغ</label><input id="amount" type="number" step="0.01" min="0.01" placeholder="0.00"></div>
<div class="field" style="grid-column:span 2"><label>البيان</label><input id="notes" placeholder="مثال: تحصيل فاتورة / سداد مورد"></div>
</div>
<div class="note">رقم الحركة/المرجع يتم إنشاؤه تلقائيًا عند الترحيل، وليس عند حفظ المسودة.</div>
<div class="actions"><button class="primary" onclick="save()">💾 حفظ كمسودة</button><a href="cash-banks.html">🏦 الخزائن والبنوك</a><a href="accounting.html">← الرئيسية</a></div>
<div id="msg" class="msg">الحركات المحفوظة هنا مسودات، ولن تؤثر على الأرصدة أو الحسابات حتى يتم ترحيلها.</div></div>
<div class="card"><h3 style="margin-top:0">آخر الحركات</h3><div class="table-wrap"><table><thead><tr><th>رقم الحركة</th><th>التاريخ</th><th>النوع</th><th>الحساب</th><th>الطرف</th><th>المبلغ</th><th>البيان</th></tr></thead><tbody id="list"></tbody></table></div></div>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient('https://fyqyodnboryzaejlhdlk.supabase.co','sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
$('date').value='2026-09-01';let accounts=[],customers=[],suppliers=[],partyMap={};
async function init(){let [a,c,s]=await Promise.all([sb.from('finance_accounts').select('id,name_ar,code').eq('active',true).order('code'),sb.from('customers').select('id,name').order('name'),sb.from('suppliers').select('id,name').order('name')]);if(a.error||c.error||s.error){$('msg').textContent='تعذر تحميل البيانات: '+(a.error||c.error||s.error).message;return}accounts=a.data||[];customers=c.data||[];suppliers=s.data||[];$('account').innerHTML=accounts.map(x=>'<option value="'+x.id+'">'+esc(x.name_ar)+'</option>').join('');partyChange();loadList()}
function partyChange(){const t=$('partyType').value;partyMap={};const list=$('partyList'),input=$('party');if(t==='customer'){list.innerHTML=customers.map(x=>{partyMap[x.name]=x.id;return '<option value="'+esc(x.name)+'"></option>'}).join('');input.placeholder='اكتب للبحث عن العميل';}else if(t==='supplier'){list.innerHTML=suppliers.map(x=>{partyMap[x.name_ar]=x.id;return '<option value="'+esc(x.name_ar)+'"></option>'}).join('');input.placeholder='اكتب للبحث عن المورد';}else{list.innerHTML='';input.placeholder='بدون طرف';input.value='';}}
$('partyType').onchange=partyChange;
async function save(){const amount=Number($('amount').value);if(!amount||amount<=0)return $('msg').textContent='اكتب مبلغ صحيح.';const t=$('partyType').value,p=partyMap[$('party').value]||'';let row={transaction_no:null,transaction_date:$('date').value,finance_account_id:$('account').value,transaction_type:$('type').value,party_type:t,amount,reference_no:null,notes:$('notes').value||null};if(t==='customer')row.customer_id=p||null;if(t==='supplier')row.supplier_id=p||null;const r=await sb.from('finance_transactions').insert(row);if(r.error)return $('msg').textContent='خطأ: '+r.error.message;$('msg').textContent='تم حفظ الحركة كمسودة بنجاح. رقم الحركة سيُنشأ تلقائيًا عند الترحيل.';$('amount').value='';$('notes').value='';loadList()}
async function loadList(){const r=await sb.from('finance_transactions').select('id,transaction_no,transaction_date,transaction_type,amount,notes,finance_account_id,customer_id,supplier_id').order('created_at',{ascending:false}).limit(30);if(r.error){$('list').innerHTML='<tr><td colspan="7">'+esc(r.error.message)+'</td></tr>';return}const amap=Object.fromEntries(accounts.map(x=>[x.id,x.name_ar])),cmap=Object.fromEntries(customers.map(x=>[x.id,x.name])),smap=Object.fromEntries(suppliers.map(x=>[x.id,x.name]));$('list').innerHTML=(r.data||[]).map(x=>'<tr><td>'+(x.transaction_no??'مسودة')+'</td><td>'+esc(x.transaction_date)+'</td><td class="'+(x.transaction_type==='receipt'?'type-receipt':'type-payment')+'">'+(x.transaction_type==='receipt'?'قبض':'صرف')+'</td><td>'+esc(amap[x.finance_account_id]||'')+'</td><td>'+esc(cmap[x.customer_id]||smap[x.supplier_id]||'—')+'</td><td>'+Number(x.amount).toLocaleString('ar-EG',{minimumFractionDigits:2})+'</td><td>'+esc(x.notes||'')+'</td></tr>').join('')||'<tr><td colspan="7" class="empty">لا توجد حركات.</td></tr>'}init();
</script></body></html>
