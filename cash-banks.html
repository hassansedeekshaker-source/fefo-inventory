<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخزائن والبنوك</title><style>body{font-family:Tahoma,Arial;background:#f4f6fa;margin:0;color:#172033}header{background:#18243a;color:#fff;padding:18px}main{max-width:1100px;margin:25px auto;padding:0 15px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 12px #0001;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.box{border:1px solid #e2e6ee;border-radius:12px;padding:18px}.amount{font-size:25px;font-weight:bold;margin-top:12px}.bank{color:#155eef}.cash{color:#087443}a,button{display:inline-block;border:0;border-radius:9px;padding:11px 16px;text-decoration:none;cursor:pointer;background:#18243a;color:#fff;margin:4px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>🏦 الخزائن والبنوك</b></header><main><div class="card"><h2>أرصدة الخزائن والبنوك</h2><p>أرصدة أول المدة المسجلة للنظام.</p><div id="msg">جاري التحميل...</div></div><div id="grid" class="grid"></div><div class="card"><h3>إجمالي النقدية والبنوك</h3><div id="total" class="amount">0.00 جنيه</div></div><a href="accounting.html">← العودة للقائمة الرئيسية</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const sb=supabase.createClient('https://fyqyodnboryzaejlhdlk.supabase.co','sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2');const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function load(){const r=await sb.from('finance_accounts').select('code,name_ar,account_type,opening_balance,active').in('code',['BANK-001','BANK-002','BANK-003','CASH-001']).order('code');if(r.error){msg.textContent='تعذر تحميل الأرصدة: '+r.error.message;return}let total=0;grid.innerHTML=(r.data||[]).map(x=>{const n=Number(x.opening_balance||0);total+=n;return '<div class="box"><h3>'+ (x.account_type==='bank'?'🏦 ':'💰 ')+esc(x.name_ar)+'</h3><div class="amount '+(x.account_type==='bank'?'bank':'cash')+'">'+n.toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' جنيه</div></div>'}).join('');totalEl=document.getElementById('total');totalEl.textContent=total.toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' جنيه';msg.textContent='تم تحميل 4 حسابات.'}load()</script></body></html>
