<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسوية المخزون</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f6fa;color:#172033}
header{background:#18243a;color:#fff;padding:16px 22px;display:flex;justify-content:space-between}
main{max-width:1050px;margin:20px auto;padding:0 15px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 12px #0001;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:6px}
label{font-size:13px;font-weight:bold;color:#475467}input,select,textarea{padding:11px;border:1px solid #d6dce8;border-radius:9px;font-family:inherit;font-size:14px}
button,a{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;text-decoration:none;font-family:inherit;font-size:14px;display:inline-block}
.primary{background:#18243a;color:#fff}.light{background:#eef2f7;color:#172033}.success{background:#087443;color:#fff}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.msg{margin-top:14px;padding:12px;border-radius:9px;background:#f5f7fa}
.ok{color:#087443}.bad{color:#b42318}.note{font-size:12px;color:#667085;line-height:1.7}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.box{background:#f7f9fc;border-radius:10px;padding:14px}.box b{display:block;margin-bottom:6px}.value{font-size:20px;font-weight:bold}
@media(max-width:750px){.grid,.summary{grid-template-columns:1fr}}
</style></head>
<body>
<header><b>⚖️ تسوية المخزون</b><span>إضافة / عجز جرد</span></header>
<main>
<div class="card">
<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">إضافة أو تسوية المخزون</h2><a class="light" href="accounting.html">🏠 الرئيسية</a></div>
<p class="note">الإضافة تعالج زيادة فعلية في المخزون، والعجز يعالج نقص الجرد. التكلفة المستخدمة هي متوسط تكلفة الصنف الحالي. كل عملية تُرحّل بحركة مخزون وقيد محاسبي.</p>
<div class="grid">
<div class="field"><label>التاريخ</label><input id="date" type="date"></div>
<div class="field"><label>المخزن / الموقع</label><select id="site"></select></div>
<div class="field"><label>نوع الحركة</label><select id="type"><option value="increase">إضافة مخزون</option><option value="shortage">عجز جرد</option></select></div>
<div class="field" style="grid-column:span 2"><label>الصنف</label><select id="item"></select></div>
<div class="field"><label>الكمية</label><input id="qty" type="number" min=".001" step=".001" value="1"></div>
<div class="field" style="grid-column:span 3"><label>السبب / البيان</label><input id="notes" placeholder="مثال: تسوية جرد آخر الشهر"></div>
</div>
<div class="summary">
<div class="box"><b>الرصيد الحالي</b><div class="value" id="stock">0.000</div></div>
<div class="box"><b>متوسط التكلفة</b><div class="value" id="cost">0.00</div></div>
<div class="box"><b>قيمة التسوية</b><div class="value" id="total">0.00</div></div>
</div>
<div class="actions"><button class="success" onclick="postAdjustment()">📤 ترحيل التسوية</button><button class="light" onclick="location.reload()">↻ إعادة</button></div>
<div id="msg" class="msg">اختر المخزن والصنف.</div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://fyqyodnboryzaejlhdlk.supabase.co','sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2');
const $=id=>document.getElementById(id);let user,items=[],sites=[];
function msg(s,c){$('msg').className='msg '+(c||'');$('msg').textContent=s}
async function cost(){const item=$('item').value,site=$('site').value;if(!item||!site)return {q:0,c:0,v:0};const r=await sb.from('inventory_costs').select('qty_on_hand,weighted_avg_cost,inventory_value').eq('item_id',item).eq('site_id',site).maybeSingle();if(r.error)throw r.error;const d=r.data||{};return {q:Number(d.qty_on_hand||0),c:Number(d.weighted_avg_cost||items.find(x=>x.id===item)?.purchase_price||0),v:Number(d.inventory_value||0)}}
async function refresh(){try{const x=await cost();$('stock').textContent=x.q.toFixed(3);$('cost').textContent=x.c.toFixed(2);$('total').textContent=(x.c*Number($('qty').value||0)).toFixed(2)}catch(e){msg(e.message||e,'bad')}}
async function init(){const s=await sb.auth.getSession();if(!s.data.session){location.href='accounting.html';return}user=s.data.session.user;$('date').value=new Date().toISOString().slice(0,10);const [ir,sr]=await Promise.all([sb.from('inv_items').select('id,sku,name_ar,unit_name,purchase_price').eq('active',true).order('name_ar'),sb.from('inv_sites').select('id,name_ar,code').eq('active',true).order('name_ar')]);if(ir.error)throw ir.error;if(sr.error)throw sr.error;items=ir.data||[];sites=sr.data||[];$('site').innerHTML=sites.map(x=>'<option value="'+x.id+'">'+x.name_ar+' — '+x.code+'</option>').join('');$('item').innerHTML='<option value="">-- اختر الصنف --</option>'+items.map(x=>'<option value="'+x.id+'">'+x.name_ar+' — '+x.sku+'</option>').join('');$('site').onchange=refresh;$('item').onchange=refresh;$('qty').oninput=refresh;refresh()}
async function postAdjustment(){try{const site=$('site').value,item=$('item').value,type=$('type').value,qty=Number($('qty').value||0),date=$('date').value,notes=$('notes').value.trim();if(!site||!item||qty<=0)return msg('اختر المخزن والصنف وأدخل كمية صحيحة.','bad');const x=await cost();if(type==='shortage'&&qty>x.q)return msg('كمية العجز أكبر من رصيد المخزون.','bad');if(x.c<0)return msg('متوسط التكلفة غير صحيح.','bad');const id=crypto.randomUUID(),value=qty*x.c;
if(type==='shortage'){const lr=await sb.from('inv_lots').select('id,qty_on_hand,expiry_date').eq('item_id',item).eq('site_id',site).gt('qty_on_hand',0).order('expiry_date',{ascending:true});if(lr.error)throw lr.error;let rem=qty;for(const lot of (lr.data||[])){if(rem<=0)break;const take=Math.min(rem,Number(lot.qty_on_hand||0));const u=await sb.from('inv_lots').update({qty_on_hand:Number(lot.qty_on_hand)-take}).eq('id',lot.id);if(u.error)throw u.error;const m=await sb.from('inv_movements').insert({item_id:item,site_id:site,lot_id:lot.id,movement_type:'issue',qty:take,unit_cost:x.c,reference_type:'inventory_adjustment',reference_id:id,notes:notes||'عجز جرد',created_by:user.id});if(m.error)throw m.error;rem-=take}if(rem>0)throw Error('تعذر استكمال خصم العجز من التشغيلات.')}else{const lot=await sb.from('inv_lots').insert({item_id:item,site_id:site,qty_on_hand:qty,qty_reserved:0,unit_cost:x.c,batch_no:'ADJ-'+id.slice(0,8),expiry_date:null}).select('id').single();if(lot.error)throw lot.error;const m=await sb.from('inv_movements').insert({item_id:item,site_id:site,lot_id:lot.data.id,movement_type:'receipt',qty,unit_cost:x.c,reference_type:'inventory_adjustment',reference_id:id,notes:notes||'إضافة مخزون',created_by:user.id});if(m.error)throw m.error}
const nq=type==='shortage'?x.q-qty:x.q+qty,nv=type==='shortage'?Math.max(0,x.v-value):x.v+value;const cu=await sb.from('inventory_costs').upsert({item_id:item,site_id:site,qty_on_hand:nq,inventory_value:nv,weighted_avg_cost:nq?nv/nq:0,updated_at:new Date().toISOString()},{onConflict:'item_id,site_id'});if(cu.error)throw cu.error;
const [ia,inv]=await Promise.all([sb.from('coa_accounts').select('id').eq('code',type==='shortage'?'6410':'4920').single(),sb.from('coa_accounts').select('id').eq('code','1310').single()]);if(ia.error)throw ia.error;if(inv.error)throw inv.error;
const je=await sb.from('journal_entries').insert({entry_date:date,source_type:'inventory_adjustment',source_id:id,description:type==='shortage'?'عجز جرد':'إضافة مخزون',posted:true,created_by:user.id}).select().single();if(je.error)throw je.error;
const lines=type==='shortage'?[{entry_id:je.data.id,account_id:ia.data.id,debit:value,credit:0,description:'عجز جرد',site_id:site},{entry_id:je.data.id,account_id:inv.data.id,debit:0,credit:value,description:'نقص المخزون بسبب الجرد',site_id:site}]:[{entry_id:je.data.id,account_id:inv.data.id,debit:value,credit:0,description:'إضافة مخزون بسبب الجرد',site_id:site},{entry_id:je.data.id,account_id:ia.data.id,debit:0,credit:value,description:'أرباح فروق جرد',site_id:site}];const jl=await sb.from('journal_lines').insert(lines);if(jl.error)throw jl.error;msg('تم ترحيل التسوية ✓ وتم تحديث المخزون والقيد المحاسبي.','ok');$('qty').value=1;$('notes').value='';await refresh()}catch(e){msg(e.message||e,'bad')}}
init().catch(e=>msg(e.message||e,'bad'));
</script></body></html>
