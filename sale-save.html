<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حفظ المبيعات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;color:#17233b}#app{max-width:1250px;margin:25px auto}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 3px 16px #0001}.top{display:flex;gap:10px;margin-bottom:14px}.top a,.btn,button{border:0;border-radius:9px;padding:10px 16px;background:#e8edf5;color:#17233b;text-decoration:none;cursor:pointer}.top a:first-child,.ok{background:#087f4f;color:#fff}.head{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}label{display:flex;flex-direction:column;gap:6px}input,select{padding:10px;border:1px solid #ccd5e3;border-radius:8px}table{width:100%;border-collapse:collapse;margin:18px 0}th,td{padding:10px;border-bottom:1px solid #e5e9f0;text-align:right}th{background:#eef2f7}.msg{padding:12px;margin-top:14px;border-radius:8px}.msg.ok{background:#e5f7ee;color:#087f4f}.msg.bad{background:#fdecec;color:#b42318}@media(max-width:800px){.head{grid-template-columns:1fr 1fr}}</style></head><body data-workflow="sale-save"><main id="app"></main><script src="workflow.js"></script></body></html>
