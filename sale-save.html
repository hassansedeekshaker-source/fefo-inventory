<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حفظ المبيعات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f6f8fb;color:#172033}#app{width:min(1500px,98%);margin:14px auto}.card{background:#fff;border:1px solid #dfe5ed;border-radius:12px;padding:18px;box-shadow:0 2px 10px #0000000a}.top{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.top a,.btn,button{border:1px solid #d7dee8;border-radius:7px;padding:9px 14px;background:#fff;color:#172033;text-decoration:none;cursor:pointer;white-space:nowrap;font-size:14px}.top a:first-child{background:#172a46;color:#fff}.invoice-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.invoice-title h1{font-size:34px;margin:0;font-weight:500}.header-grid{display:grid;grid-template-columns:1.15fr 1.15fr 1.15fr 1fr;gap:10px;margin-bottom:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-weight:700;font-size:13px;color:#202b3d}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d5dce6;border-radius:6px;background:#fff;font-size:14px}.readonly{background:#f4f6f9!important}.notes{grid-column:span 2}.notes textarea{min-height:42px;resize:vertical}.table-wrap{overflow:auto;border:1px solid #dfe4ea;border-radius:8px;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:1050px;font-size:13px}th{background:#f0f2f5;color:#111;padding:10px 7px;border-bottom:1px solid #d5dbe4;white-space:nowrap}td{padding:7px;border-bottom:1px solid #edf0f4;text-align:center;vertical-align:middle}td input,td select{width:100%;padding:8px 6px;border:1px solid #d6dde7;border-radius:5px;background:#fff}td .readonly{background:#f7f8fa}.add-row{display:block;text-align:center;padding:11px;background:#f7f9fc;color:#087fae;border-top:1px solid #e2e7ee;cursor:pointer}.totals{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}.total-box{border:1px solid #dfe5ed;border-radius:8px;padding:10px;text-align:center;background:#fff}.total-box b{display:block;font-size:13px;margin-bottom:7px}.total-value{font-size:20px;font-weight:700}.total-box.net{background:#f0f7ff;border-color:#82b5f4}.total-box.net .total-value{font-size:24px;color:#1264b4}.actions{display:flex;gap:8px;justify-content:flex-start;margin-top:14px;flex-wrap:wrap}.actions button{min-width:125px}.save{background:#172a46!important;color:#fff!important;border-color:#172a46!important}.approve{background:#198754!important;color:#fff!important;border-color:#198754!important}.msg{padding:10px;margin-top:12px;border-radius:7px}.msg.ok{background:#e8f7ef;color:#087f4f}.msg.bad{background:#fdecec;color:#b42318}@media(max-width:950px){.header-grid{grid-template-columns:1fr 1fr}.notes{grid-column:span 2}.totals{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.header-grid{grid-template-columns:1fr}.notes{grid-column:span 1}.totals{grid-template-columns:1fr 1fr}.invoice-title h1{font-size:28px}}</style></head><body data-workflow="sale-save"><main id="app"></main><script src="workflow.js?v=20261005v2"></script><script>
(function(){
  function addBack(){
    const exists=[...document.querySelectorAll('button,a')].some(el=>el.textContent.includes('رجوع للشاشة السابقة'));
    if(exists)return;
    const b=document.createElement('button');
    b.type='button';
    b.textContent='↩ رجوع للشاشة السابقة';
    b.className='btn';
    b.style.cssText='margin-left:8px;cursor:pointer;';
    b.onclick=function(){ if(window.history.length>1){window.history.back();}else{window.location.href='accounting.html';} };
    const main=document.querySelector('main')||document.body;
    const top=main.querySelector('.top');
    if(top) top.prepend(b); else main.insertBefore(b,main.firstChild);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',addBack);else addBack();
})();
</script></body></html>
