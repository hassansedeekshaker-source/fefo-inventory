<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حفظ المصروف</title><style>*{box-sizing:border-box}body{font-family:Tahoma,Arial;background:#f4f6fa;margin:0;color:#172033}header{background:#18243a;color:#fff;padding:17px 24px;display:flex;justify-content:space-between}main{max-width:980px;margin:28px auto;padding:0 22px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 3px 18px #00000012;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}.field.wide{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:bold;color:#475467}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d5dbe6;border-radius:9px;font-family:inherit;font-size:14px;background:#fff;min-height:42px}textarea{min-height:85px}.readonly{background:#f3f5f8;color:#475467}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid #eef1f5}button,a{border:0;border-radius:9px;padding:11px 18px;cursor:pointer;text-decoration:none;background:#18243a;color:#fff;font-family:inherit;min-height:42px}button.success{background:#087443}.msg{margin-top:14px;padding:12px;border-radius:9px;background:#f5f7fa}.bad{color:#b42318}.ok{color:#087443}.small{font-size:12px;color:#667085}.login{max-width:480px;margin:70px auto}@media(max-width:750px){.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}}@media(max-width:500px){.grid{grid-template-columns:1fr}}.picker{position:relative}.picker-results{display:none;position:fixed;z-index:99999;background:#fff;border:1px solid #b8c5d6;border-radius:7px;max-height:300px;overflow:auto;box-shadow:0 8px 24px #0003}.picker-option{display:block;width:100%;border:0;border-bottom:1px solid #eef1f5;background:#fff;text-align:right;padding:10px;cursor:pointer;color:#172033;font-family:inherit}.picker-option:hover{background:#eaf2ff}.picker-empty{padding:10px;color:#667085}</style></head><body><header><b>🧾 حفظ المصروفات</b><span id="status">جاري الاتصال...</span></header><main id="login" class="card login"><h2>تسجيل الدخول</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور" style="margin-top:8px"><button onclick="login()" style="margin-top:10px">دخول</button><div id="auth"></div></main><main id="app" style="display:none"><div class="card"><h2>💰 مصروف جديد</h2><p class="small">اختيار نوع المصروف يحدد حساب المصروف المحاسبي تلقائيًا. واختيار طريقة الدفع يحدد الخزينة أو البنك الذي سيُخصم منه عند الترحيل.</p><div class="grid">
<div class="field"><label>التاريخ</label><input id="date" type="date"></div>
<div class="field"><label>نوع المصروف</label><div class="picker"><input id="categorySearch" autocomplete="off" placeholder="ابحث بالكود أو اسم المصروف"><div id="categoryResults" class="picker-results"></div></div><input id="category" type="hidden"></div>
<div class="field"><label>حساب المصروف المحاسبي</label><input id="expenseAccount" class="readonly" readonly></div>
<div class="field"><label>المبلغ</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00"></div>
<div class="field"><label>طريقة الدفع</label><select id="method" onchange="fillPaymentAccounts()"><option value="cash">خزينة</option><option value="bank">بنك</option><option value="accrued">مصروف مستحق</option></select></div>
<div class="field"><label>الخزينة / البنك</label><select id="payAccount"></select></div>
<div class="field"><label>الموقع / الفرع</label><select id="site"></select></div>
<div class="field wide"><label>البيان</label><input id="desc" placeholder="مثال: كهرباء شهر سبتمبر"></div>
</div><div class="actions"><button class="success" onclick="saveExpense()">💾 حفظ كمسودة</button><a href="expenses.html">📋 المصروفات</a><a href="expenses-posting.html">📤 الترحيل</a><a href="accounting.html">← الرئيسية</a></div><div id="msg" class="msg">المصروف محفوظ كمسودة ولا يؤثر على الرصيد حتى الترحيل.</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient('https://fyqyodnboryzaejlhdlk.supabase.co','sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let user,cats=[],accounts=[],sites=[];
async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)return $('auth').innerHTML='<div class="msg bad">'+esc(r.error.message)+'</div>';start(r.data.user)}
async function start(u){user=u;$('login').style.display='none';$('app').style.display='block';$('status').textContent='متصل';$('date').value=new Date().toISOString().slice(0,10);await load()}
async function load(){const [c,a,s,coa]=await Promise.all([sb.from('expense_categories').select('id,code,name_ar,account_id').eq('active',true).order('code'),sb.from('finance_accounts').select('id,code,name_ar,account_type').eq('active',true).order('code'),sb.from('inv_sites').select('id,code,name_ar').eq('active',true).order('code'),sb.from('coa_accounts').select('id,code,name_ar').order('code')]);if(c.error||a.error||s.error||coa.error)return $('msg').innerHTML='<span class="bad">'+esc((c.error||a.error||s.error||coa.error).message)+'</span>';cats=c.data||[];accounts=a.data||[];sites=s.data||[];window.coaAccounts=coa.data||[];setupCategoryPicker();$('category').innerHTML='<option value="">اختر نوع المصروف</option>'+cats.map(x=>'<option value="'+x.id+'">'+esc(x.code+' — '+x.name_ar)+'</option>').join('');$('site').innerHTML='<option value="">بدون تحديد</option>'+sites.map(x=>'<option value="'+x.id+'">'+esc(x.code+' — '+x.name_ar)+'</option>').join('');fillPaymentAccounts()}
function setupCategoryPicker(){const input=$('categorySearch'),box=$('categoryResults');function draw(){const q=input.value.trim().toLocaleLowerCase();const found=cats.filter(x=>!q||String(x.name_ar||'').toLocaleLowerCase().includes(q)||String(x.code||'').toLocaleLowerCase().includes(q)).slice(0,30);box.innerHTML=found.length?found.map(x=>'<button type="button" class="picker-option" data-id="'+esc(x.id)+'">'+esc(x.name_ar)+' — '+esc(x.code)+'</button>').join(''):'<div class="picker-empty">لا توجد مصروفات مطابقة</div>';const r=input.getBoundingClientRect();box.style.left=r.left+'px';box.style.width=Math.max(260,r.width)+'px';box.style.top=r.bottom+'px';box.style.display='block';box.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const x=cats.find(z=>z.id===b.dataset.id);input.value=x.name_ar+' — '+x.code;$('category').value=x.id;box.style.display='none';showExpenseAccount()})}input.addEventListener('input',draw);input.addEventListener('focus',draw);input.addEventListener('keydown',e=>{if(e.key==='Escape')box.style.display='none';if(e.key==='Enter'){const b=box.querySelector('[data-id]');if(b){e.preventDefault();b.click()}}});document.addEventListener('click',e=>{if(!input.parentElement.contains(e.target))box.style.display='none'})}function showExpenseAccount(){const c=cats.find(x=>x.id===$('category').value);const a=(window.coaAccounts||[]).find(x=>x.id===c?.account_id);$('expenseAccount').value=a?(a.code+' — '+a.name_ar):'يتم تحديده تلقائيًا عند الترحيل'}
function fillPaymentAccounts(){const m=$('method').value;const a=accounts.filter(x=>m==='cash'?x.account_type==='cash':m==='bank'?x.account_type==='bank':false);$('payAccount').innerHTML=m==='accrued'?'<option value="">لا يوجد دفع الآن — مستحق</option>':'<option value="">اختر '+(m==='cash'?'الخزينة':'البنك')+'</option>'+a.map(x=>'<option value="'+x.id+'">'+esc(x.name_ar)+'</option>').join('');$('payAccount').disabled=m==='accrued'}
async function saveExpense(){const cat=$('category').value,amt=Number($('amount').value||0),m=$('method').value,pay=$('payAccount').value;if(!cat||amt<=0)return $('msg').innerHTML='<span class="bad">اختر نوع المصروف وأدخل مبلغًا صحيحًا.</span>';if(m!=='accrued'&&!pay)return $('msg').innerHTML='<span class="bad">اختر الخزينة أو البنك.</span>';const r=await sb.from('expenses').insert({expense_date:$('date').value,category_id:cat,description:$('desc').value.trim()||null,amount:amt,payment_method:m,payment_account_id:m==='accrued'?null:pay,site_id:$('site').value||null,status:'draft',created_by:user.id}).select('id').single();if(r.error)return $('msg').innerHTML='<span class="bad">خطأ: '+esc(r.error.message)+'</span>';$('msg').innerHTML='<span class="ok">تم حفظ المصروف كمسودة بنجاح ✓ حساب المصروف محدد تلقائيًا.</span>';$('amount').value='';$('desc').value=''}
sb.auth.getSession().then(r=>r.data.session?start(r.data.session.user):$('status').textContent='غير مسجل الدخول');
</script></body></html>
