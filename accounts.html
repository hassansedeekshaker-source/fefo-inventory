<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحسابات وكشوف الحساب</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:Tahoma,Arial,sans-serif}header{background:#18243a;color:#fff;padding:18px 24px;display:flex;justify-content:space-between}main{max-width:1250px;margin:20px auto;padding:0 15px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #0001}.bar{display:flex;gap:8px;flex-wrap:wrap}.bar a,.bar button,button{padding:10px 15px;border:0;border-radius:9px;background:#18243a;color:#fff;text-decoration:none;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:220px}.field label{display:block;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #d6dce8;border-radius:9px;font-size:14px;background:#fff}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf0f5;text-align:right}th{background:#eef2f7}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.num{font-size:24px;font-weight:bold;margin-top:8px}.muted{color:#667085;font-size:12px}.empty{text-align:center;padding:20px;color:#667085}@media(max-width:750px){.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.summary{grid-template-columns:1fr}}
@media print{header,.bar,.filters,.no-print{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}.print-title{display:block!important}.summary{grid-template-columns:repeat(4,1fr)}}
.print-title{display:none;text-align:center}</style></head>
<body><header><b>📚 الحسابات وكشوف الحساب</b><span id="status">غير مسجل الدخول</span></header>
<main id="login" class="card"><h2>تسجيل الدخول</h2><input id="email" type="email" placeholder="البريد الإلكتروني" style="margin-bottom:8px"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="login()" style="margin-top:10px">دخول</button><p id="msg"></p></main>
<main id="app" style="display:none"><div class="bar"><a href="accounting.html">🏠 الرئيسية</a><a href="reports.html">📊 التقارير</a></div>
<section class="card filters"><h2>📒 كشف الحساب</h2><div class="row"><div class="field"><label>الحساب</label><select id="account"><option value="">اختر الحساب...</option></select></div><div class="field"><label>من تاريخ</label><input id="from" type="date"></div><div class="field"><label>إلى تاريخ</label><input id="to" type="date"></div><button onclick="loadStatement()">عرض الكشف</button><button onclick="window.print()">🖨️ طباعة</button></div><p id="msg2" class="muted"></p></section>
<section id="statement" style="display:none"><h2 class="print-title">كشف حساب</h2><section class="card"><div id="accountName"></div><div class="summary"><div>الرصيد الافتتاحي<div id="opening" class="num">0.00</div></div><div>إجمالي المدين<div id="debit" class="num">0.00</div></div><div>إجمالي الدائن<div id="credit" class="num">0.00</div></div><div>الرصيد النهائي<div id="closing" class="num">0.00</div></div></div></section>
<section class="card"><h2>حركة الحساب</h2><table><thead><tr><th>التاريخ</th><th>رقم القيد</th><th>البيان</th><th>المصدر</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody id="lines"></tbody></table></section></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient('https://fyqyodnboryzaejlhdlk.supabase.co','sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let accounts=[];
function dates(){let d=new Date(),to=d.toISOString().slice(0,10),f=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);$('from').value=f;$('to').value=to}
async function login(){let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('msg').textContent=r.error.message;return}start()}
async function start(){ $('login').style.display='none';$('app').style.display='block';$('status').textContent='متصل';dates();const p=new URLSearchParams(location.search);if(p.get('customer_id')||p.get('supplier_id')){await loadPartyStatement(p);return}await loadAccounts()}
async function loadPartyStatement(p){try{
 const customerId=p.get('customer_id'),supplierId=p.get('supplier_id'),isC=!!customerId,id=Number(customerId||supplierId);
 const table=isC?'customers':'suppliers', key=isC?'customer_id':'supplier_id';
 let r=await sb.from(table).select('id,name,opening_balance').eq('id',id).single();if(r.error)throw r.error;const party=r.data;
 const [docs,rets]=await Promise.all([
  sb.from(isC?'sales':'purchases').select('id,'+(isC?'invoice_no,sale_date,total':'invoice_no,purchase_date,total')).eq(key,id).eq('status','posted'),
  sb.from(isC?'sales_returns':'purchase_returns').select('id,return_no,return_date,total').eq(key,id).eq('status','posted')
 ]);
 if(docs.error)throw docs.error;if(rets.error)throw rets.error;
 const rows=[];let balance=Number(party.opening_balance||0),d=0,cr=0;
 for(const x of docs.data||[]){const amount=Number(x.total||0);rows.push({date:x[isC?'sale_date':'purchase_date'],no:x.invoice_no||x.id,desc:isC?'فاتورة مبيعات':'فاتورة مشتريات',debit:isC?amount:0,credit:isC?0:amount});}
 for(const x of rets.data||[]){const amount=Number(x.total||0);rows.push({date:x.return_date,no:x.return_no||x.id,desc:isC?'مرتجع مبيعات':'مردود مشتريات',debit:isC?0:amount,credit:isC?amount:0});}
 rows.sort((x,y)=>String(x.date).localeCompare(String(y.date)));
 const title= isC?'كشف حساب العميل':'كشف حساب المورد';
 $('account').innerHTML='<option value="">'+title+' — '+esc(party.name)+'</option>';$('account').disabled=true;
 $('accountName').innerHTML='<b>'+title+': '+esc(party.name)+'</b><div class="muted">الكود: '+(isC?'CUS-':'SUP-')+String(id).padStart(6,'0')+'</div>';
 for(const x of rows){d+=x.debit;cr+=x.credit;balance+=x.debit-x.credit;}
 $('opening').textContent=Number(party.opening_balance||0).toFixed(2);$('debit').textContent=d.toFixed(2);$('credit').textContent=cr.toFixed(2);$('closing').textContent=balance.toFixed(2);
 let running=Number(party.opening_balance||0);
 $('lines').innerHTML=rows.map(x=>{running+=x.debit-x.credit;return '<tr><td>'+esc(x.date)+'</td><td>'+esc(x.no)+'</td><td>'+esc(x.desc)+'</td><td>'+esc(isC?'عميل':'مورد')+'</td><td>'+x.debit.toFixed(2)+'</td><td>'+x.credit.toFixed(2)+'</td><td>'+running.toFixed(2)+'</td></tr>'}).join('')||'<tr><td colspan="7" class="empty">لا توجد حركة للطرف المختار.</td></tr>';
 $('statement').style.display='block';document.querySelector('.filters h2').textContent='📒 '+title;document.querySelector('.filters .row').querySelector('button[onclick="loadStatement()"]').style.display='none';
}catch(e){$('msg2').textContent='تعذر تحميل كشف الطرف: '+e.message}}

async function loadAccounts(){try{let r=await sb.from('coa_accounts').select('id,code,name_ar,account_type,is_postable,active').eq('active',true).eq('is_postable',true).order('code');if(r.error)throw r.error;accounts=r.data||[];$('account').innerHTML='<option value="">اختر الحساب...</option>'+accounts.map(a=>'<option value="'+a.id+'">'+esc(a.code)+' — '+esc(a.name_ar)+'</option>').join('')}catch(e){$('msg2').textContent='تعذر تحميل الحسابات: '+e.message}}
async function loadStatement(){const aid=$('account').value,from=$('from').value,to=$('to').value;if(!aid||!from||!to){$('msg2').textContent='اختر الحساب والفترة أولاً';return}try{
let r=await sb.from('journal_entries').select('id,entry_no,entry_date,source_type,description').eq('posted',true).lt('entry_date',from).order('entry_date').order('entry_no');if(r.error)throw r.error;let opening=0;const oldIds=(r.data||[]).map(x=>x.id);
if(oldIds.length){r=await sb.from('journal_lines').select('entry_id,debit,credit').eq('account_id',aid).in('entry_id',oldIds);if(r.error)throw r.error;for(const x of r.data||[])opening+=Number(x.debit||0)-Number(x.credit||0)}
r=await sb.from('journal_entries').select('id,entry_no,entry_date,source_type,description').eq('posted',true).gte('entry_date',from).lte('entry_date',to).order('entry_date').order('entry_no');if(r.error)throw r.error;const entries=r.data||[],ids=entries.map(x=>x.id);let map=new Map(entries.map(x=>[x.id,x]));let jl=[];
if(ids.length){r=await sb.from('journal_lines').select('entry_id,debit,credit').eq('account_id',aid).in('entry_id',ids);if(r.error)throw r.error;jl=r.data||[]}
let by=new Map(jl.map(x=>[x.entry_id,x]));let balance=opening,totalD=0,totalC=0,rows=[];
for(const e of entries){const x=by.get(e.id);if(!x)continue;const d=Number(x.debit||0),c=Number(x.credit||0);totalD+=d;totalC+=c;balance+=d-c;rows.push('<tr><td>'+esc(e.entry_date)+'</td><td>'+esc(e.entry_no)+'</td><td>'+esc(e.description||'')+'</td><td>'+esc(e.source_type||'')+'</td><td>'+d.toFixed(2)+'</td><td>'+c.toFixed(2)+'</td><td>'+balance.toFixed(2)+'</td></tr>')}
const a=accounts.find(x=>x.id===aid);$('accountName').innerHTML='<b>الحساب: '+esc(a?.code)+' — '+esc(a?.name_ar)+'</b><div class="muted">الفترة: '+esc(from)+' إلى '+esc(to)+'</div>';$('opening').textContent=opening.toFixed(2);$('debit').textContent=totalD.toFixed(2);$('credit').textContent=totalC.toFixed(2);$('closing').textContent=balance.toFixed(2);$('lines').innerHTML=rows.join('')||'<tr><td colspan="7" class="empty">لا توجد حركة خلال الفترة.</td></tr>';$('statement').style.display='block';$('msg2').textContent=''
}catch(e){$('msg2').textContent='تعذر تحميل كشف الحساب: '+e.message}}
sb.auth.getSession().then(r=>r.data.session?start():null)
</script></body></html>
