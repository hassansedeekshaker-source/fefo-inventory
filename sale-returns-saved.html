<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرتجعات المبيعات المحفوظة</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fb;font-family:Tahoma,Arial;color:#172033}.wrap{padding:14px}.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btn,button{padding:9px 14px;border:1px solid #d7dee8;border-radius:7px;background:#fff;color:#172033;text-decoration:none;cursor:pointer}.card{background:#fff;border:1px solid #dfe5ed;border-radius:8px;padding:14px}h1{margin:0 0 14px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #dfe5ed;padding:9px;text-align:center}th{background:#eef2f7}.ok{background:#087f4f;color:#fff}.bad{background:#fdecec;color:#b42318}.msg{margin-top:12px;padding:10px;border-radius:7px}</style></head><body><div class="wrap"><div class="top"><a class="btn" href="accounting.html">🏠 الرئيسية</a><a class="btn" href="sales.html">↩ المبيعات</a><a class="btn" href="sale-return-save.html">➕ حركة جديدة</a><a class="btn" href="sale-return-post.html">📤 الترحيل</a></div><div class="card"><h1>مرتجعات المبيعات المحفوظة</h1><button onclick="load()">🔄 تحديث</button><table><thead><tr><th>تحديد</th><th>الرقم</th><th>التاريخ</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody id="rows"></tbody></table><div id="msg"></div></div></div><script>
var API='https://fyqyodnboryzaejlhdlk.supabase.co/rest/v1',KEY='sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2';
function token(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('sb-fyqyodnboryzaejlhdlk-auth-token')===0){var x=JSON.parse(localStorage.getItem(k));return x.access_token||(x.currentSession&&x.currentSession.access_token)||''}}}catch(e){}return ''}
function req(path,method,body){return new Promise(function(res,rej){var x=new XMLHttpRequest();x.open(method||'GET',API+'/'+path,true);x.setRequestHeader('apikey',KEY);x.setRequestHeader('Authorization','Bearer '+(token()||KEY));if(body){x.setRequestHeader('Content-Type','application/json')}x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status>=200&&x.status<300)res(x.responseText?JSON.parse(x.responseText):null);else rej(new Error(x.status+' '+x.responseText))};x.send(body?JSON.stringify(body):null)})}
function show(s,c){document.getElementById('msg').className='msg '+c;document.getElementById('msg').textContent=s}
async function load(){try{var a=await req('sales_returns?select=*&status=eq.draft&order=return_date.desc');document.getElementById('rows').innerHTML=(a||[]).map(function(x){return '<tr><td><button onclick="cancelDoc(\''+x.id+'\')">🗑 حذف</button></td><td>'+String(x.return_no||x.id.slice(0,8))+'</td><td>'+String(x.return_date||'')+'</td><td>'+Number(x.total||0).toFixed(2)+'</td><td>مسودة</td></tr>'}).join('')||'<tr><td colspan="5">لا توجد مسودات محفوظة.</td></tr>'}catch(e){show(e.message,'bad')}}
async function cancelDoc(id){if(!confirm('حذف هذه المسودة؟'))return;try{await req('sales_returns?id=eq.'+id,'PATCH',{status:'cancelled'});show('تم حذف المسودة ✓','ok');load()}catch(e){show(e.message,'bad')}}
load();
</script></body></html>
