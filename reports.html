<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقارير المالية</title>
<style>body{margin:0;background:#f4f6fa;font-family:Tahoma,Arial;color:#172033}header{background:#18243a;color:#fff;padding:18px 24px;display:flex;justify-content:space-between}main{max-width:1250px;margin:20px auto;padding:0 15px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #0001}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:180px}input,button{padding:10px;border:1px solid #d6dce8;border-radius:9px;font-size:14px}button{cursor:pointer;background:#18243a;color:#fff;border:0}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf0f5;text-align:right}th{background:#eef2f7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.num{font-size:25px;font-weight:bold;margin-top:8px}.profit{font-weight:bold}.links a{display:inline-block;padding:9px 12px;background:#fff;border:1px solid #d6dce8;border-radius:9px;text-decoration:none;color:#18243a;margin-left:7px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><b>📊 التقارير المالية</b><span id="status">غير مسجل الدخول</span></header><main id="login" class="card"><h2>تسجيل الدخول</h2><div class="field"><label>البريد</label><input id="email" type="email" style="width:100%"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" style="width:100%;margin-top:8px"></div><button onclick="login()" style="margin-top:10px">دخول</button><p id="msg"></p></main>
<main id="app" style="display:none"><div class="links"><a href="accounting.html">الرئيسية</a><a href="expenses.html">المصروفات</a></div>
<section class="card"><h2>فترة التقرير</h2><div class="row"><div class="field"><label>من</label><input id="from" type="date"></div><div class="field"><label>إلى</label><input id="to" type="date"></div><button onclick="load()">تحديث التقرير</button></div></section>
<div class="grid"><div class="card">إجمالي الإيرادات<div id="rev" class="num">0.00</div></div><div class="card">تكلفة المبيعات<div id="cogs" class="num">0.00</div></div><div class="card">المصروفات التشغيلية<div id="opex" class="num">0.00</div></div><div class="card">صافي الربح / الخسارة<div id="net" class="num profit">0.00</div></div></div>
<section class="card"><h2>قائمة الأرباح والخسائر</h2><table><thead><tr><th>الكود</th><th>الحساب</th><th>نوع الحساب</th><th>المبلغ</th></tr></thead><tbody id="income"></tbody></table></section>
<section class="card"><h2>ميزان المراجعة</h2><table><thead><tr><th>الكود</th><th>الحساب</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody id="tb"></tbody></table></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient('https://fyqyodnboryzaejlhdlk.supabase.co','sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2');const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function dates(){let d=new Date(),to=d.toISOString().slice(0,10);let f=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);$('from').value=f;$('to').value=to}
async function login(){let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('msg').textContent=r.error.message;return}start()}
async function start(){ $('login').style.display='none';$('app').style.display='block';$('status').textContent='متصل';dates();await load()}
async function load(){try{
let q=sb.from('journal_entries').select('id').eq('posted',true).gte('entry_date',$('from').value).lte('entry_date',$('to').value);let r=await q;if(r.error)throw r.error;let ids=(r.data||[]).map(x=>x.id);
let incomeMap=new Map(), tbMap=new Map();
if(ids.length){r=await sb.from('journal_lines').select('entry_id,account_id,debit,credit').in('entry_id',ids);if(r.error)throw r.error;let lines=r.data||[];
r=await sb.from('coa_accounts').select('id,code,name_ar,account_type,is_postable').eq('active',true).eq('is_postable',true);if(r.error)throw r.error;let acc=new Map(r.data.map(a=>[a.id,a]));
for(let l of lines){let a=acc.get(l.account_id);if(!a)continue;let x=tbMap.get(a.id)||{a,debit:0,credit:0};x.debit+=Number(l.debit||0);x.credit+=Number(l.credit||0);tbMap.set(a.id,x)}
for(let x of tbMap.values()){let amt=x.a.account_type==='revenue'?x.credit-x.debit:x.a.account_type==='expense'?x.debit-x.credit:0;if(x.a.account_type==='revenue'||x.a.account_type==='expense')incomeMap.set(x.a.id,{a:x.a,amount:amt})}}
let inc=[...incomeMap.values()];let rev=inc.filter(x=>x.a.account_type==='revenue').reduce((s,x)=>s+x.amount,0);let cogs=inc.filter(x=>x.a.code==='5100').reduce((s,x)=>s+x.amount,0);let opex=inc.filter(x=>x.a.account_type==='expense'&&x.a.code!=='5100'&&x.a.code!=='5200').reduce((s,x)=>s+x.amount,0);let net=rev-inc.filter(x=>x.a.account_type==='expense').reduce((s,x)=>s+x.amount,0);
$('rev').textContent=rev.toFixed(2);$('cogs').textContent=cogs.toFixed(2);$('opex').textContent=opex.toFixed(2);$('net').textContent=net.toFixed(2);
$('income').innerHTML=inc.map(x=>'<tr><td>'+esc(x.a.code)+'</td><td>'+esc(x.a.name_ar)+'</td><td>'+esc(x.a.account_type)+'</td><td>'+x.amount.toFixed(2)+'</td></tr>').join('');
$('tb').innerHTML=[...tbMap.values()].sort((x,y)=>x.a.code.localeCompare(y.a.code)).map(x=>'<tr><td>'+esc(x.a.code)+'</td><td>'+esc(x.a.name_ar)+'</td><td>'+x.debit.toFixed(2)+'</td><td>'+x.credit.toFixed(2)+'</td><td>'+(x.debit-x.credit).toFixed(2)+'</td></tr>').join('');
}catch(e){$('status').textContent='خطأ: '+e.message}}
sb.auth.getSession().then(r=>r.data.session?start():null)
</script></body></html>
