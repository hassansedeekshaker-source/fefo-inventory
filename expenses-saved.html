<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المصروفات المحفوظة</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f7fb;color:#172033}header{background:#18243a;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}main{max-width:1350px;margin:20px auto;padding:0 15px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 12px #0001}button,.btn{border:0;border-radius:9px;padding:10px 15px;cursor:pointer;background:#e9edf5;color:#172033;text-decoration:none;display:inline-block;margin:2px}.primary{background:#18243a!important;color:#fff}.success{background:#087443!important;color:#fff}.danger{background:#b42318!important;color:#fff}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:11px 8px;border-bottom:1px solid #edf0f5;text-align:center}th{background:#eef2f7}.msg{padding:11px;border-radius:9px;margin-top:12px}.ok{background:#e8f7ef;color:#087443}.bad{background:#fdecec;color:#b42318}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalbox{background:#fff;border-radius:16px;padding:22px;width:min(700px,100%)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}input,select,textarea{padding:10px;border:1px solid #d6dce8;border-radius:9px;font-size:14px}textarea{min-height:75px}@media(max-width:700px){.grid{grid-template-columns:1fr}table{font-size:12px}}</style></head>
<body><header><b>🧾 نظام المحاسبة — المصروفات المحفوظة</b><a href="accounting.html"><button>🏠 الرئيسية</button></a></header>
<main id="login" class="card" style="max-width:480px;margin:70px auto;display:none"><h2>تسجيل الدخول</h2><p>استخدم نفس حساب نظام المحاسبة.</p><input id="email" type="email" placeholder="البريد الإلكتروني" style="width:100%;margin-bottom:10px"><input id="password" type="password" placeholder="كلمة المرور" style="width:100%;margin-bottom:10px"><button class="primary" onclick="login()">دخول</button><div id="authMsg"></div></main><main id="app" style="display:none"><section class="card"><h1>📋 المصروفات المحفوظة</h1><p>كل مصروف تم حفظه ولم يتم ترحيله يظهر هنا. يمكنك فتحه وتعديله أو حذفه أو ترحيله.</p>
<div><a class="btn success" href="expenses-save.html">➕ حفظ مصروف جديد</a><button class="primary" onclick="load()">🔄 تحديث</button><a class="btn" href="expenses-posting.html">📤 شاشة الترحيل</a></div><div id="msg"></div>
<table><thead><tr><th>اختيار</th><th>رقم</th><th>التاريخ</th><th>نوع المصروف</th><th>البيان</th><th>المبلغ</th><th>الدفع</th><th>الموقع</th><th>إجراءات</th></tr></thead><tbody id="body"></tbody></table></section></main>
<div id="modal" class="modal"><div class="modalbox"><h2>✏️ فتح وتعديل المصروف</h2><input id="editId" type="hidden"><div class="grid">
<label class="field">التاريخ<input id="edDate" type="date"></label><label class="field">المبلغ<input id="edAmount" type="number" min="0" step=".01"></label>
<label class="field">نوع المصروف<select id="edCat"></select></label><label class="field">طريقة الدفع<select id="edMethod"><option value="cash">خزينة</option><option value="bank">بنك</option><option value="accrued">مستحق</option></select></label>
<label class="field">حساب الدفع<select id="edPay"></select></label><label class="field">المورد / الجهة<input id="edSupplier" type="number"></label>
<label class="field" style="grid-column:1/-1">البيان<textarea id="edDesc"></textarea></label></div>
<div style="margin-top:15px"><button class="success" onclick="saveEdit()">💾 حفظ التعديل</button><button onclick="closeEdit()">إلغاء</button></div><div id="editMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient('https://fyqyodnboryzaejlhdlk.supabase.co','sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let data=[],cats=[],accounts=[]; async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('authMsg').innerHTML='<div class="msg bad">'+esc(r.error.message)+'</div>';return}start()} async function start(){ $('login').style.display='none'; $('app').style.display='block'; await init(); }
const fallbackCats=[{id:'5e6dad57-091a-4591-bfe7-40eb7f26e33c',code:'EXP-001',name_ar:'إيجارات'},{id:'cb4dce19-5d2e-48a4-9325-e985fb0ef093',code:'EXP-002',name_ar:'كهرباء'},{id:'9b1b6b51-692e-475d-93e6-d51e671ed62e',code:'EXP-003',name_ar:'مياه'},{id:'c684bad5-5026-4496-98ab-033fcca6e046',code:'EXP-004',name_ar:'غاز'},{id:'d0028501-866e-41bc-8a9f-118da38c2ac2',code:'EXP-005',name_ar:'رواتب وأجور'},{id:'82fedea0-f355-44f5-9dff-d1d519bb8c48',code:'EXP-006',name_ar:'نقل ومواصلات'}];
const fallbackAccounts=[{id:'6fd5c3ae-3c20-48cb-b52d-ee4eb9c19aaa',code:'1110',name_ar:'الخزينة الرئيسية'},{id:'62651bb2-cf90-46ff-bb02-6da5d59a8bf1',code:'1210',name_ar:'البنك الرئيسي'}];
async function init(){let c=await sb.from('expense_categories').select('id,code,name_ar,account_id').eq('active',true).order('code');let a=await sb.from('coa_accounts').select('id,code,name_ar,active,is_postable').eq('active',true).eq('is_postable',true).order('code');cats=c.error||!c.data?.length?fallbackCats:c.data;accounts=a.error||!a.data?.length?fallbackAccounts:a.data;$('edCat').innerHTML=cats.map(x=>'<option value="'+x.id+'">'+esc(x.code+' — '+x.name_ar)+'</option>').join('');load()}
function payOpts(m,sel){let a=m==='cash'?accounts.filter(x=>String(x.code).startsWith('11')):m==='bank'?accounts.filter(x=>String(x.code).startsWith('12')):[];$('edPay').innerHTML='<option value="">-- اختر --</option>'+a.map(x=>'<option value="'+x.id+'" '+(x.id===sel?'selected':'')+'>'+esc(x.code+' — '+x.name_ar)+'</option>').join('');$('edPay').disabled=m==='accrued'}
$('edMethod').onchange=()=>payOpts($('edMethod').value,$('edPay').value);
async function load(){let r=await sb.from('expenses').select('id,expense_no,expense_date,description,amount,payment_method,payment_account_id,cash_account_id,site_id,supplier_id,status,category_id,expense_categories(name_ar,code),inv_sites(name_ar,code)').eq('status','draft').order('expense_date',{ascending:false}).order('expense_no',{ascending:false});if(r.error)return $('msg').innerHTML='<div class="msg bad">'+esc(r.error.message)+'</div>';data=r.data||[];$('body').innerHTML=data.length?data.map(x=>'<tr><td><input type="checkbox" class="ck" value="'+x.id+'"></td><td>'+x.expense_no+'</td><td>'+x.expense_date+'</td><td>'+esc((x.expense_categories?.code||'')+' — '+(x.expense_categories?.name_ar||''))+'</td><td>'+esc(x.description||'-')+'</td><td>'+Number(x.amount||0).toFixed(2)+'</td><td>'+({cash:'خزينة',bank:'بنك',accrued:'مستحق'}[x.payment_method]||x.payment_method)+'</td><td>'+esc(x.inv_sites?.name_ar||'-')+'</td><td><button onclick="edit(''+x.id+'')">✏️ فتح وتعديل</button><button class="danger" onclick="del(''+x.id+'')">🗑 حذف</button><button class="success" onclick="postOne(''+x.id+'')">📤 ترحيل</button></td></tr>').join(''):'<tr><td colspan="9">لا توجد مصروفات محفوظة حاليًا.</td></tr>'}
function edit(id){let x=data.find(v=>v.id===id);if(!x)return;$('editId').value=id;$('edDate').value=x.expense_date;$('edAmount').value=x.amount;$('edCat').value=x.category_id||'';$('edMethod').value=x.payment_method;$('edSupplier').value=x.supplier_id||'';$('edDesc').value=x.description||'';payOpts(x.payment_method,x.payment_account_id||x.cash_account_id);$('modal').classList.add('open')}
function closeEdit(){$('modal').classList.remove('open');$('editMsg').innerHTML=''}
async function saveEdit(){try{let id=$('editId').value,m=$('edMethod').value,p=$('edPay').value;if(!$('edCat').value||Number($('edAmount').value)<0)return $('editMsg').innerHTML='<div class="msg bad">راجع البيانات.</div>';if(m!=='accrued'&&!p)return $('editMsg').innerHTML='<div class="msg bad">اختر حساب الدفع.</div>';let r=await sb.from('expenses').update({expense_date:$('edDate').value,category_id:$('edCat').value,description:$('edDesc').value.trim()||null,amount:Number($('edAmount').value),payment_method:m,payment_account_id:m==='accrued'?null:p,cash_account_id:m==='accrued'?null:p,supplier_id:$('edSupplier').value?Number($('edSupplier').value):null,updated_at:new Date().toISOString()}).eq('id',id).eq('status','draft');if(r.error)throw r.error;closeEdit();await load();$('msg').innerHTML='<div class="msg ok">تم حفظ التعديل ✓</div>'}catch(e){$('editMsg').innerHTML='<div class="msg bad">'+esc(e.message||e)+'</div>'}}
async function del(id){if(!confirm('هل تريد حذف هذه المسودة؟'))return;let r=await sb.from('expenses').update({status:'cancelled',updated_at:new Date().toISOString()}).eq('id',id).eq('status','draft');if(r.error)return $('msg').innerHTML='<div class="msg bad">'+esc(r.error.message)+'</div>';await load();$('msg').innerHTML='<div class="msg ok">تم حذف المسودة ✓</div>'}
function postOne(id){location.href='expenses-posting.html?select='+encodeURIComponent(id)}
sb.auth.getSession().then(r=>r.data.session?start():$('login').style.display='block');
</script></body></html>
