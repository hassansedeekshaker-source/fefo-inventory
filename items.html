<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأصناف | نظام المحاسبة</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f6fa;color:#172033}header{background:#18243a;color:#fff;padding:16px 24px;display:flex;justify-content:space-between}.wrap{max-width:1350px;margin:20px auto;padding:0 15px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 12px #0001;margin-bottom:16px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.back{background:#e9edf5;border:0;border-radius:9px;padding:11px 16px;cursor:pointer}.primary{background:#18243a;color:#fff;border:0;border-radius:9px;padding:11px 16px;cursor:pointer}.success{background:#087443;color:#fff;border:0;border-radius:9px;padding:11px 16px;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}input,select{padding:11px;border:1px solid #d6dce8;border-radius:9px;font-size:14px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:11px;border-bottom:1px solid #edf0f5;text-align:right}th{background:#eef2f7}.msg{padding:12px;border-radius:9px;background:#eef4ff;margin-top:12px}.ok{color:#087443}.bad{color:#b42318}.small{font-size:12px;color:#667085}.search{max-width:400px}.empty{padding:25px;text-align:center;color:#667085}@media(max-width:700px){th,td{white-space:nowrap}.tablewrap{overflow:auto}}</style></head><body><header><b>📦 نظام إدارة المخزون والمحاسبة</b><span>قسم الأصناف</span></header><main class="wrap"><div class="card bar"><button class="back" onclick="goBack()">↩ رجوع للشاشة السابقة</button><button class="primary" onclick="location.href='accounting.html'">🏠 الرئيسية</button></div><section class="card"><div class="bar" style="justify-content:space-between"><div><h2 style="margin:0">📦 الأصناف</h2><div class="small">من هنا تختار الصنف وتفتح بطاقة الصنف كاملة.</div></div><span id="status">جاري تحميل الأصناف...</span></div><div class="row" style="margin-top:15px"><div class="field search"><label>بحث باسم الصنف أو الكود</label><input id="search" oninput="render()" placeholder="اكتب اسم الصنف أو SKU"></div><button class="success" onclick="document.getElementById('iname').focus()">➕ إضافة صنف جديد</button></div></section><section id="addCard" class="card"><h3>➕ إضافة صنف جديد</h3><div class="row"><div class="field"><label>اسم الصنف</label><input id="iname"></div><div class="field"><label>الوحدة</label><input id="unit" placeholder="كيلو / عدد / كرتونة / كيس"></div><div class="field"><label>الحد الأدنى</label><input id="min" type="number" min="0" value="0"></div><div class="field"><label>سعر الشراء</label><input id="ppurchase" type="number" min="0" step=".01" value="0"></div><div class="field"><label>سعر البيع</label><input id="psale" type="number" min="0" step=".01" value="0"></div><button class="success" onclick="addItem()">💾 حفظ الصنف</button></div><div id="msg"></div></section><section class="card"><h3>📋 قائمة الأصناف</h3><div class="tablewrap"><table><thead><tr><th>الكود</th><th>اسم الصنف</th><th>الوحدة</th><th>الحد الأدنى</th><th>سعر البيع</th><th>الإجراء</th></tr></thead><tbody id="body"><tr><td colspan="6">جاري التحميل...</td></tr></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const sb=supabase.createClient('https://fyqyodnboryzaejlhdlk.supabase.co','sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2');let items=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function goBack(){if(history.length>1)history.back();else location.href='accounting.html'}function render(){const s=($('search').value||'').trim().toLowerCase();const data=items.filter(x=>!s||String(x.name_ar||'').toLowerCase().includes(s)||String(x.sku||'').toLowerCase().includes(s));$('body').innerHTML=data.map(x=>'<tr><td>'+esc(x.sku)+'</td><td><b>'+esc(x.name_ar)+'</b></td><td>'+esc(x.unit_name||x.inv_units?.name_ar||'-')+'</td><td>'+Number(x.min_stock||0)+'</td><td>'+Number(x.sale_price||0).toFixed(2)+'</td><td><button class="primary" onclick="openCard(\''+x.id+'\')">📋 بطاقة الصنف</button></td></tr>').join('')||'<tr><td colspan="6" class="empty">لا توجد أصناف.</td></tr>'}async function load(){const r=await sb.from('inv_items').select('id,sku,name_ar,unit_name,min_stock,sale_price,unit_id,inv_units(name_ar)').eq('active',true).order('name_ar');if(r.error){$('status').textContent='خطأ في تحميل الأصناف';$('body').innerHTML='<tr><td colspan="6" class="bad">'+esc(r.error.message)+'</td></tr>';return}items=r.data||[];$('status').textContent='عدد الأصناف: '+items.length;render()}async function addItem(){try{const name=$('iname').value.trim(),unitName=$('unit').value.trim();if(!name||!unitName)return $('msg').innerHTML='<div class="msg bad">اكتب اسم الصنف والوحدة.</div>';let ur=await sb.from('inv_units').select('id').eq('name_ar',unitName).eq('active',true).maybeSingle();if(ur.error)throw ur.error;let unitId=ur.data?.id;if(!unitId){const u=await sb.from('inv_units').insert({code:'U-'+Date.now().toString(36).toUpperCase(),name_ar:unitName,active:true}).select('id').single();if(u.error)throw u.error;unitId=u.data.id}const r=await sb.from('inv_items').insert({name_ar:name,unit_id:unitId,min_stock:Number($('min').value||0),purchase_price:Number($('ppurchase').value||0),sale_price:Number($('psale').value||0),tax_rate:0});if(r.error)throw r.error;$('msg').innerHTML='<div class="msg ok">تم إضافة الصنف بنجاح.</div>';$('iname').value='';$('unit').value='';$('min').value=0;$('ppurchase').value=0;$('psale').value=0;await load()}catch(e){$('msg').innerHTML='<div class="msg bad">'+esc(e.message||e)+'</div>'}}function openCard(id){location.href='item.html?id='+encodeURIComponent(id)}load();</script></body></html>
