<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>المردودات المحفوظة للمشتريات</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f4f6fa;margin:0;color:#17233b}
#app{width:min(1400px,96%);margin:18px auto;padding:0 8px}.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.top a,.btn,button{border:0;border-radius:9px;padding:10px 14px;background:#e8edf5;color:#17233b;text-decoration:none;cursor:pointer;white-space:nowrap}
.top a:first-child,.new-movement,.ok{background:#087f4f;color:#fff}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 3px 16px #0001;overflow:auto}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}th,td{padding:10px 8px;border-bottom:1px solid #e5e9f0;text-align:center}th{background:#eef2f7}.msg{padding:12px;margin-top:14px;border-radius:8px}.msg.ok{background:#e5f7ee;color:#087f4f}.msg.bad{background:#fdecec;color:#b42318}
</style>
</head>
<body data-workflow="purchase-return-saved">
<main id="app"><p>جاري تحميل مردودات المشتريات المحفوظة...</p></main>
<script src="workflow.js?v=saved-returns-fix-1" onerror="document.getElementById('app').innerHTML='تعذر تحميل ملف النظام. حدّث الصفحة وحاول مرة أخرى.'"></script>
</body>
</html>
