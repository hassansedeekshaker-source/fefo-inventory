<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاتورة مرتجع مشتريات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#202733;font-family:Arial,sans-serif}.wrap{max-width:1400px;margin:auto}.nav{height:62px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:18px;padding:0 28px}.nav a{color:#333;text-decoration:none;font-weight:600}.nav .brand{margin-left:auto;font-size:18px}.page{padding:24px 36px}.crumb{color:#178c86;font-size:15px;margin-bottom:8px}.actions{display:flex;gap:8px;margin-bottom:14px}.btn{border:1px solid #d4d8dd;background:#fff;border-radius:7px;padding:8px 15px;text-decoration:none;color:#333;cursor:pointer}.btn.primary{background:#0b8177;color:#fff;border-color:#0b8177}.paper{background:#fff;border:1px solid #ddd;border-radius:6px;min-height:600px;padding:34px 42px}.status{display:inline-block;background:#e7f4f1;color:#08796f;border:1px solid #b9ded8;border-radius:4px;padding:8px 22px;font-weight:700}.headrow{display:grid;grid-template-columns:1fr 1.4fr;gap:35px;align-items:start;margin-top:25px}.title{font-size:38px;font-weight:700;margin:0 0 10px}.meta{display:grid;grid-template-columns:150px 1fr;gap:13px 20px;font-size:16px}.meta .label{color:#707780}.amountbox{display:flex;justify-content:flex-end;gap:70px;padding-top:15px}.amount{text-align:center;min-width:130px}.amount .label{display:block;color:#777;margin-bottom:8px}.amount strong{font-size:22px}.party{margin-top:30px;border-top:1px solid #e3e3e3;padding-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:30px}.party h3{margin:0 0 10px}.party p{margin:5px 0;color:#555}.tablewrap{margin-top:35px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}th{background:#f1f2f4;padding:14px 10px;border-bottom:2px solid #d5d7da;font-weight:700}td{padding:14px 10px;border-bottom:1px solid #e4e5e7;text-align:center}td:first-child,th:first-child{text-align:right}.code{font-family:Arial;color:#555}.totals{margin:24px 0 0 auto;width:390px;border-top:2px solid #333}.totals div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.totals .grand{font-size:20px;font-weight:700}.note{margin-top:28px;color:#666;font-size:14px}.picker{background:#fff;border:1px solid #ddd;border-radius:6px;padding:16px;margin-bottom:18px;display:flex;gap:12px;align-items:center}.picker select{padding:9px;min-width:300px;border:1px solid #bbb;border-radius:5px}@media(max-width:900px){.page{padding:15px}.paper{padding:20px}.headrow,.party{grid-template-columns:1fr}.amountbox{justify-content:flex-start;gap:25px}.title{font-size:28px}.nav{padding:0 15px}.meta{grid-template-columns:120px 1fr}}@media print{body{background:#fff}.nav,.actions,.picker{display:none}.page{padding:0}.paper{border:0;padding:10px}.status{border:1px solid #999}}</style></head><body><div class="nav"><div class="brand">نظام المحاسبة والمخزون</div><a href="accounting.html">الرئيسية</a><a href="purchase-return-save.html">مردود مشتريات جديد</a><a href="purchase-return-save.html?saved=1">المحفوظة</a><a href="purchase-return-post.html">الترحيل</a></div><main class="page"><div class="crumb">مشتريات / مردودات المشتريات</div><div class="actions"><a class="btn" href="accounting.html">↩ الرئيسية</a><button class="btn" onclick="window.print()">🖨 طباعة</button><button class="btn" onclick="history.back()">← السابق</button><button class="btn" onclick="nextReturn()">التالي →</button></div><div id="picker" class="picker" style="display:none"><b>اختيار المرتجع:</b><select id="returnSelect"></select></div><section class="paper" id="paper"><div>جاري تحميل الفاتورة...</div></section></main><script>const SB_URL='https://fyqyodnboryzaejlhdlk.supabase.co';const SB_KEY='sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2';const sb=supabase.createClient(SB_URL,SB_KEY);let returns=[],currentIndex=0;const qp=new URLSearchParams(location.search);const wanted=qp.get('id');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>Number(n||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2});async function init(){const auth=await sb.auth.getSession();if(!auth.data.session){location.href='accounting.html';return}const r=await sb.from('purchase_returns').select('id,return_no,supplier_id,site_id,return_date,total,status').eq('status','posted').order('return_date',{ascending:false}).order('return_no',{ascending:false});if(r.error){showError(r.error.message);return}returns=r.data||[];if(!returns.length){showError('لا توجد مردودات مشتريات مرحّلة حتى الآن.');return}currentIndex=wanted?Math.max(0,returns.findIndex(x=>x.id===wanted)):0;renderPicker();await renderReturn(returns[currentIndex])}function renderPicker(){const p=document.getElementById('picker'),s=document.getElementById('returnSelect');if(returns.length<1)return;p.style.display='flex';s.innerHTML=returns.map((x,i)=>'<option value="'+x.id+'">مرتجع '+esc(x.return_no)+' — '+esc(x.return_date)+'</option>').join('');s.value=returns[currentIndex].id;s.onchange=()=>{currentIndex=returns.findIndex(x=>x.id===s.value);history.replaceState(null,'','purchase-return-view.html?id='+encodeURIComponent(s.value));renderReturn(returns[currentIndex])}}async function renderReturn(ret){const [sup,site,lines]=await Promise.all([sb.from('suppliers').select('id,name').eq('id',ret.supplier_id).maybeSingle(),sb.from('inv_sites').select('id,name_ar').eq('id',ret.site_id).maybeSingle(),sb.from('purchase_return_lines').select('id,item_id,qty,unit_cost,purchase_line_id,source_purchase_line_id').eq('return_id',ret.id)]);if(sup.error||site.error||lines.error){showError((sup.error||site.error||lines.error).message);return}const itemIds=(lines.data||[]).map(x=>x.item_id).filter(Boolean),sourceIds=(lines.data||[]).map(x=>x.source_purchase_line_id||x.purchase_line_id).filter(Boolean);let items=[],sources=[];if(itemIds.length){const q=await sb.from('inv_items').select('id,name_ar,sku,unit_id').in('id',itemIds);items=q.data||[]}if(sourceIds.length){const q=await sb.from('purchase_lines').select('id,purchase_id,tax_rate,tax_amount,unit_cost').in('id',sourceIds);sources=q.data||[]}const purchaseIds=sources.map(x=>x.purchase_id).filter(Boolean);let purchases=[];if(purchaseIds.length){const q=await sb.from('purchases').select('id,invoice_no,purchase_date').in('id',purchaseIds);purchases=q.data||[]}const unitIds=items.map(x=>x.unit_id).filter(Boolean);let units=[];if(unitIds.length){const q=await sb.from('inv_units').select('id,name_ar,name').in('id',unitIds);units=q.data||[]}let sub=0,tax=0;const rows=(lines.data||[]).map((l,i)=>{const it=items.find(x=>x.id===l.item_id)||{},src=sources.find(x=>x.id===(l.source_purchase_line_id||l.purchase_line_id))||{},pur=purchases.find(x=>x.id===src.purchase_id)||{},unit=units.find(x=>x.id===it.unit_id)||{};const rate=Number(src.tax_rate||0),base=Number(l.qty||0)*Number(l.unit_cost||0),tx=Number(src.tax_amount||0)>0?Number(src.tax_amount)*Number(l.qty||0)/Math.max(Number(src.tax_amount||0),0.000001):base*rate/100;sub+=base;tax+=tx;return '<tr><td><b>'+esc(it.name_ar||'-')+'</b><div class="code">'+esc(it.sku||'')+'</div></td><td>'+esc(unit.name_ar||unit.name||'-')+'</td><td>'+esc(pur.invoice_no||'—')+'<div class="code">'+esc(pur.purchase_date||'')+'</div></td><td>'+Number(l.qty||0).toLocaleString('ar-EG')+'</td><td>'+money(l.unit_cost)+'</td><td>'+money(base)+'</td><td>'+ (rate>0?rate+'%':'0%')+'</td><td>'+money(tx)+'</td><td>'+money(base+tx)+'</td></tr>'});const shownTotal=Number(ret.total||sub+tax);document.getElementById('paper').innerHTML='<span class="status">'+(ret.status==='posted'?'مُرحّل':'مغلق')+'</span><div class="headrow"><div><h1 class="title">فاتورة مرتجع مشتريات / '+esc(ret.return_no)+'</h1><div class="meta"><span class="label">رقم إذن المرتجع</span><b>'+esc(ret.return_no)+'</b><span class="label">التاريخ</span><b>'+esc(ret.return_date)+'</b><span class="label">المورد</span><b>'+esc(sup.data?.name||'-')+'</b><span class="label">المخزن</span><b>'+esc(site.data?.name_ar||'-')+'</b></div></div><div class="amountbox"><div class="amount"><span class="label">قيمة الفاتورة</span><strong>'+money(sub)+'</strong></div><div class="amount"><span class="label">إجمالي الضريبة</span><strong>'+money(tax)+'</strong></div><div class="amount"><span class="label">إجمالي الفاتورة</span><strong>'+money(shownTotal)+'</strong></div></div></div><div class="tablewrap"><table><thead><tr><th>الصنف / الكود</th><th>الوحدة</th><th>من فاتورة الشراء</th><th>الكمية</th><th>سعر الوحدة</th><th>القيمة</th><th>معدل الضريبة</th><th>قيمة الضريبة</th><th>الإجمالي</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div><div class="totals"><div><span>قيمة المرتجع</span><b>'+money(sub)+'</b></div><div><span>إجمالي الضريبة</span><b>'+money(tax)+'</b></div><div class="grand"><span>الإجمالي</span><b>'+money(shownTotal)+'</b></div></div><div class="note">تم ربط كل صنف بإذن الشراء الأصلي، وتظهر تكلفة المرتجع من نفس الإذن، مع عرض الضريبة كما هي في سطر الشراء الأصلي.</div>'}function showError(e){document.getElementById('paper').innerHTML='<div style="padding:30px;color:#b42318"><h2>تعذر عرض الفاتورة</h2><p>'+esc(e)+'</p></div>'}function nextReturn(){if(!returns.length)return;currentIndex=(currentIndex+1)%returns.length;const id=returns[currentIndex].id;history.replaceState(null,'','purchase-return-view.html?id='+encodeURIComponent(id));document.getElementById('returnSelect').value=id;renderReturn(returns[currentIndex])}init();</script></body></html>
