<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مردود مشتريات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;color:#17233b}#app{width:min(1400px,96%);margin:22px auto}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 3px 16px #0001}.top{display:flex;gap:10px;margin-bottom:14px}.top a,.btn,button{border:0;border-radius:9px;padding:10px 16px;background:#e8edf5;color:#17233b;text-decoration:none;cursor:pointer}.top a:first-child,.ok{background:#087f4f;color:#fff}.head{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}label{display:flex;flex-direction:column;gap:6px;font-weight:600}input,select{width:100%;padding:10px;border:1px solid #ccd5e3;border-radius:8px;background:#fff}table{width:100%;border-collapse:collapse;margin:18px 0}th,td{padding:9px;border-bottom:1px solid #e5e9f0;text-align:center}th{background:#eef2f7}.locked{background:#f1f3f6!important;color:#555}.hint{font-size:12px;color:#667085;margin-top:4px}.msg{padding:12px;margin-top:14px;border-radius:8px}.msg.ok{background:#e5f7ee;color:#087f4f}.msg.bad{background:#fdecec;color:#b42318}@media(max-width:900px){.head{grid-template-columns:1fr 1fr}table{font-size:12px}}</style></head><body data-workflow="purchase-return-save"><main id="app"></main><script src="workflow.js"></script><script>(function(){function sourceCell(tr){if(!tr||tr.dataset.sourceReady)return;const item=tr.querySelector('.item');if(!item)return;tr.dataset.sourceReady='1';const cell=document.createElement('td');cell.innerHTML='<select class="sourceInvoice"><option value="">اختر إذن الشراء</option></select><div class="hint">اختر إذن الشراء الأصلي</div>';tr.insertBefore(cell,tr.children[1]);const load=async()=>{const sel=tr.querySelector('.sourceInvoice');sel.innerHTML='<option value="">جاري تحميل أذون الشراء...</option>';const itemId=item.value,site=document.getElementById('site')?.value;if(!itemId||!site){sel.innerHTML='<option value="">اختر الصنف والموقع أولاً</option>';return}const q=await sb.from('purchase_lines').select('id,purchase_id,qty,unit_cost,tax_rate,purchases!inner(invoice_no,purchase_date,site_id,status)').eq('item_id',itemId).eq('purchases.site_id',site).eq('purchases.status','posted').order('purchase_id',{ascending:false});sel.innerHTML='<option value="">اختر إذن الشراء</option>';const seen=new Set();(q.data||[]).forEach(x=>{if(seen.has(x.purchase_id))return;seen.add(x.purchase_id);const p=x.purchases,o=document.createElement('option');o.value=x.id;o.dataset.qty=x.qty;o.dataset.cost=x.unit_cost;o.dataset.tax=x.tax_rate;o.textContent='إذن '+(p.invoice_no||x.purchase_id)+' — '+(p.purchase_date||'')+' — سعر '+Number(x.unit_cost||0).toFixed(2)+(Number(x.tax_rate||0)>0?' — ضريبة '+Number(x.tax_rate).toFixed(2)+'%':' — بدون ضريبة');sel.appendChild(o)});if(!q.data?.length)sel.innerHTML='<option value="">لا توجد أذون شراء مرحّلة</option>';sel.onchange=()=>{const o=sel.selectedOptions[0];if(!o?.value)return;const price=tr.querySelector('.price'),cost=tr.querySelector('.cost');if(price){price.value=Number(o.dataset.cost||0).toFixed(2);price.readOnly=true;price.classList.add('locked');price.title='السعر مأخوذ من إذن الشراء'}if(cost){cost.value=Number(o.dataset.cost||0).toFixed(2);cost.readOnly=true;cost.classList.add('locked')}let tax=tr.querySelector('.sourceTax');if(!tax){tax=document.createElement('input');tax.type='hidden';tax.className='sourceTax';tr.appendChild(tax)}tax.value=Number(o.dataset.tax||0);const qty=tr.querySelector('.qty');if(qty){qty.max=o.dataset.qty;qty.title='الحد الأقصى من هذا الإذن: '+o.dataset.qty}if(typeof window.updateInvoiceSummary==='function')window.updateInvoiceSummary()};};item.addEventListener('change',load);load()}function scan(){document.querySelectorAll('#lines tr').forEach(sourceCell)}const obs=new MutationObserver(scan);obs.observe(document.body,{childList:true,subtree:true});const timer=setInterval(()=>{scan();if(document.querySelector('#lines tr'))clearInterval(timer)},100);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',scan);else scan()})();</script><script>(function(){function addBack(){if([...document.querySelectorAll('button,a')].some(el=>el.textContent.includes('رجوع للشاشة السابقة')))return;const b=document.createElement('button');b.type='button';b.textContent='↩ رجوع للشاشة السابقة';b.className='btn';b.onclick=function(){if(window.history.length>1)window.history.back();else location.href='accounting.html'};const main=document.querySelector('main')||document.body;const top=main.querySelector('.top');if(top)top.prepend(b);else main.insertBefore(b,main.firstChild)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',addBack);else addBack()})();</script></body></html>
