<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مردود مشتريات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;color:#17233b}#app{width:min(1400px,96%);margin:22px auto}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 3px 16px #0001}.top{display:flex;gap:10px;margin-bottom:14px}.top a,.btn,button{border:0;border-radius:9px;padding:10px 16px;background:#e8edf5;color:#17233b;text-decoration:none;cursor:pointer}.top a:first-child,.ok{background:#087f4f;color:#fff}.head{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}label{display:flex;flex-direction:column;gap:6px;font-weight:600}input,select{width:100%;padding:10px;border:1px solid #ccd5e3;border-radius:8px;background:#fff}table{width:100%;border-collapse:collapse;margin:18px 0}th,td{padding:9px;border-bottom:1px solid #e5e9f0;text-align:center}th{background:#eef2f7}.locked{background:#f1f3f6;color:#555}.hint{font-size:12px;color:#667085;margin-top:4px}.msg{padding:12px;margin-top:14px;border-radius:8px}.msg.ok{background:#e5f7ee;color:#087f4f}.msg.bad{background:#fdecec;color:#b42318}@media(max-width:900px){.head{grid-template-columns:1fr 1fr}table{font-size:12px}}</style></head><body data-workflow="purchase-return-save"><main id="app"></main><script src="workflow.js"></script><script>(function(){function addBack(){if([...document.querySelectorAll('button,a')].some(el=>el.textContent.includes('رجوع للشاشة السابقة')))return;const b=document.createElement('button');b.type='button';b.textContent='↩ رجوع للشاشة السابقة';b.className='btn';b.onclick=function(){if(window.history.length>1)window.history.back();else location.href='accounting.html'};const main=document.querySelector('main')||document.body;const top=main.querySelector('.top');if(top)top.prepend(b);else main.insertBefore(b,main.firstChild)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',addBack);else addBack()})();</script><script>window.addEventListener('load',function(){const old=window.buildSave;if(typeof old!=='function')return;window.buildSave=function(t){old(t);if(!t.includes('return'))return;document.querySelectorAll('#lines tr').forEach(attachSource);document.querySelectorAll('#lines .item').forEach(s=>s.addEventListener('change',function(){attachSource(s.closest('tr'))}))};function attachSource(tr){if(!tr)return;const item=tr.querySelector('.item');if(!item||tr.querySelector('.sourceInvoice'))return;const cell=document.createElement('td');cell.innerHTML='<select class="sourceInvoice"><option value="">اختر إذن الشراء</option></select><div class="hint">اختيار إذن الشراء إلزامي</div>';tr.insertBefore(cell,tr.children[1]);item.addEventListener('change',()=>loadSources(tr,item.value));loadSources(tr,item.value)}async function loadSources(tr,itemId){const sel=tr.querySelector('.sourceInvoice');if(!sel)return;sel.innerHTML='<option value="">اختر إذن الشراء</option>';if(!itemId)return;const site=document.getElementById('site')?.value;if(!site)return;const q=await sb.from('purchase_lines').select('id,purchase_id,qty,unit_cost,tax_rate,purchases!inner(invoice_no,purchase_date,site_id,status)').eq('item_id',itemId).eq('purchases.site_id',site).eq('purchases.status','posted').order('purchase_id',{ascending:false});const seen={};(q.data||[]).forEach(x=>{if(seen[x.purchase_id])return;seen[x.purchase_id]=1;const p=x.purchases,o=document.createElement('option');o.value=x.id;o.textContent='إذن '+(p.invoice_no||x.purchase_id)+' — '+(p.purchase_date||'')+' — سعر '+Number(x.unit_cost||0).toFixed(2)+(Number(x.tax_rate||0)>0?' — ضريبة '+Number(x.tax_rate).toFixed(2)+'%':' — بدون ضريبة');o.dataset.qty=x.qty;o.dataset.cost=x.unit_cost;o.dataset.tax=x.tax_rate;o.dataset.purchaseId=x.purchase_id;sel.appendChild(o)});if(!q.data?.length)sel.innerHTML='<option value="">لا توجد أذون شراء مرحّلة لهذا الصنف</option>';sel.onchange=()=>{const o=sel.selectedOptions[0];if(!o?.value)return;['price','cost'].forEach(cls=>{const el=tr.querySelector('.'+cls);if(el){el.value=Number(o.dataset.cost||0).toFixed(2);el.readOnly=true;el.classList.add('locked')}});let tax=tr.querySelector('.sourceTax');if(!tax){tax=document.createElement('input');tax.className='sourceTax';tax.type='hidden';tr.appendChild(tax)}tax.value=Number(o.dataset.tax||0);const qty=tr.querySelector('.qty');if(qty){qty.max=Number(o.dataset.qty||0);qty.title='الحد الأقصى من الإذن: '+o.dataset.qty}}};}</script></body></html>
