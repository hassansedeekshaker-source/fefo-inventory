<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مردود مشتريات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;color:#17233b}#app{width:min(1400px,96%);margin:22px auto}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 3px 16px #0001}.top{display:flex;gap:10px;margin-bottom:14px;align-items:center}.top a,.top button,.btn,button{border:0;border-radius:9px;padding:10px 16px;background:#e8edf5;color:#17233b;text-decoration:none;cursor:pointer;white-space:nowrap}.top a:first-child,.ok{background:#087f4f;color:#fff}.head{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}label{display:flex;flex-direction:column;gap:6px;font-weight:600}input,select{width:100%;min-width:0;padding:10px 11px;border:1px solid #ccd5e3;border-radius:8px;background:#fff;font-size:14px}table{width:100%;border-collapse:separate;border-spacing:0;margin:18px 0;font-size:13px}th,td{padding:9px 7px;border-bottom:1px solid #e5e9f0;text-align:center;vertical-align:middle}th{background:#eef2f7;font-weight:700}.msg{padding:12px;margin-top:14px;border-radius:8px}.msg.ok{background:#e5f7ee;color:#087f4f}.msg.bad{background:#fdecec;color:#b42318}@media(max-width:900px){.head{grid-template-columns:1fr 1fr}table{display:block;overflow:auto;white-space:nowrap}}@media(max-width:600px){.head{grid-template-columns:1fr}.card{padding:15px}}</style></head><body><main id="app"></main><script src="purchase-return-source.js"></script></body></html>
