<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مردود مشتريات جديد</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#18263d;font-family:Arial,Tahoma,sans-serif}.wrap{width:min(1500px,97%);margin:18px auto}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #e1e6ee;border-radius:10px;padding:10px 14px;box-shadow:0 2px 10px #0000000a}.top a{padding:9px 14px;border-radius:7px;text-decoration:none;color:#18263d;background:#eef2f7;font-weight:700}.top a:first-child{background:#fff;border:1px solid #dce3ee}.titlebar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:18px 0}.titlebar h1{margin:0;font-size:30px}.actions{display:flex;gap:8px}.actions button{border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}.save{background:#18864b;color:#fff}.post{background:#1769d2;color:#fff}.cancel{background:#e9edf3}.card{background:#fff;border:1px solid #e1e6ee;border-radius:12px;box-shadow:0 3px 18px #0000000a;padding:20px;margin-bottom:18px}.tabs{display:flex;border-bottom:1px solid #dfe5ed;margin:-20px -20px 20px}.tab{padding:13px 25px;font-weight:700;background:#f1f4f8}.tab.active{background:#fff;color:#1769d2;border-bottom:3px solid #1769d2}.head{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cfd8e5;border-radius:7px;background:#fff}.field textarea{min-height:75px;resize:vertical}.section-title{font-size:22px;font-weight:800;margin:0 0 12px}.tablebox{overflow:auto}.lines{width:100%;border-collapse:collapse;min-width:1100px}.lines th{background:#edf2f8;padding:12px 8px;white-space:nowrap;border-bottom:1px solid #dce3ed}.lines td{padding:9px 7px;text-align:center;border-bottom:1px solid #edf0f4}.lines input,.lines select{width:100%;padding:9px;border:1px solid #cfd8e5;border-radius:6px}.source{min-width:260px}.locked{background:#f0f2f5!important;color:#4b5563;font-weight:700}.add{border:0;background:#eaf0f8;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:12px}.del{border:0;background:#f7e7e7;border-radius:7px;padding:8px 11px;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.total{border:1px solid #e1e6ee;border-radius:9px;padding:15px 18px}.total b{display:block;color:#59687c;margin-bottom:8px}.total span{font-size:24px;font-weight:800}.msg{padding:12px;border-radius:8px;margin-top:12px}.ok{background:#e6f6ed;color:#087a43}.bad{background:#fdeaea;color:#b42318}@media(max-width:900px){.head,.summary{grid-template-columns:1fr 1fr}.titlebar{align-items:flex-start;flex-direction:column}}@media(max-width:600px){.head,.summary{grid-template-columns:1fr}.titlebar h1{font-size:24px}}</style></head><body><div class="wrap"><nav class="top"><a href="accounting.html">🏠 الرئيسية</a><a href="purchase-return-save.html">➕ مردود مشتريات جديد</a><a href="purchase-return-save.html?saved=1">📋 المحفوظة</a><a href="purchase-return-post.html">📤 الترحيل</a></nav><div class="titlebar"><div><h1>مردود مشتريات جديد</h1><div style="color:#667085;margin-top:5px">عمليّة مرتجع مرتبطة بإذن الشراء الأصلي</div></div><div class="actions"><button class="cancel" onclick="history.back()">✕ إلغاء</button><button class="save" onclick="saveDraft()">💾 حفظ</button><button class="post" onclick="saveAndPost()">✓ حفظ وترحيل</button></div></div><section class="card"><div class="tabs"><div class="tab active">بيانات عامة</div><div class="tab">الأصناف</div></div><div class="head"><label class="field">رقم المرتجع<input id="docno" placeholder="مثال: 00000082"></label><label class="field">التاريخ<input id="date" type="date"></label><label class="field">المورد<select id="supplier"><option value="">-- اختر المورد --</option></select></label><label class="field">المخزن<select id="site"><option value="">-- اختر المخزن --</option></select></label></div><label class="field" style="margin-top:16px">ملاحظات<textarea id="notes" placeholder="ملاحظات المرتجع"></textarea></label></section><section class="card"><div class="section-title">الأصناف</div><div class="tablebox"><table class="lines"><thead><tr><th>#</th><th>الكود</th><th>الصنف</th><th>الوحدة</th><th>من إذن الشراء</th><th>الكمية</th><th>سعر الشراء</th><th>الضريبة</th><th>قيمة الضريبة</th><th>الإجمالي</th><th>إجراء</th></tr></thead><tbody id="lines"></tbody></table></div><button class="add" onclick="addLine()">＋ إضافة صنف</button></section><section class="card"><div class="summary"><div class="total"><b>قيمة المرتجع</b><span id="subtotal">0.00</span></div><div class="total"><b>قيمة الضريبة</b><span id="taxTotal">0.00</span></div><div class="total"><b>الإجمالي</b><span id="grandTotal">0.00</span></div></div><div id="msg"></div></section></div><script>const SB_URL='https://fyqyodnboryzaejlhdlk.supabase.co',SB_KEY='sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2';const sb=supabase.createClient(SB_URL,SB_KEY);let user=null,items=[],units=[],suppliers=[],sites=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toISOString().slice(0,10);async function init(){try{const s=await sb.auth.getSession();if(!s.data.session){location.href='accounting.html';return}user=s.data.session.user;$('date').value=today();const [a,b,c,d]=await Promise.all([sb.from('inv_items').select('id,name_ar,sku,unit_id,active').eq('active',true).order('name_ar'),sb.from('inv_units').select('*').order('name_ar'),sb.from('suppliers').select('id,name').order('name'),sb.from('inv_sites').select('id,name_ar,code,active').eq('active',true).order('name_ar')]);items=a.data||[];units=b.data||[];suppliers=c.data||[];sites=d.data||[];$('supplier').innerHTML='<option value="">-- اختر المورد --</option>'+suppliers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('site').innerHTML='<option value="">-- اختر المخزن --</option>'+sites.map(x=>`<option value="${x.id}">${esc(x.name_ar)}</option>`).join('');addLine();}catch(e){show(e.message||e,'bad')}}function itemOptions(){return '<option value="">-- اختر الصنف --</option>'+items.map(x=>`<option value="${x.id}">${esc(x.name_ar)} — ${esc(x.sku||'')}</option>`).join('')}function addLine(){const tr=document.createElement('tr');tr.innerHTML=`<td class="num"></td><td class="code">-</td><td><select class="item">${itemOptions()}</select></td><td class="unit">-</td><td><select class="source"><option value="">اختر إذن الشراء</option></select></td><td><input class="qty" type="number" min=".001" step=".001" value="1"></td><td><input class="price locked" type="number" readonly value="0"></td><td class="tax">بدون ضريبة</td><td class="taxValue">0.00</td><td class="lineTotal">0.00</td><td><button class="del" type="button">🗑</button></td>`;$('lines').appendChild(tr);bindRow(tr);renumber()}function bindRow(tr){const item=tr.querySelector('.item'),source=tr.querySelector('.source'),qty=tr.querySelector('.qty');item.onchange=()=>{const x=items.find(i=>i.id===item.value);tr.querySelector('.code').textContent=x?.sku||'-';tr.querySelector('.unit').textContent=(units.find(u=>u.id===x?.unit_id)?.name_ar||units.find(u=>u.id===x?.unit_id)?.name||'-');loadSources(tr)};source.onchange=()=>applySource(tr);qty.oninput=()=>calcRow(tr);tr.querySelector('.del').onclick=()=>{tr.remove();renumber();calcTotals()};$('site').onchange=()=>loadSources(tr);$('supplier').onchange=()=>loadSources(tr)}async function loadSources(tr){const item=tr.querySelector('.item').value,site=$('site').value,supplier=$('supplier').value,source=tr.querySelector('.source');source.innerHTML='<option value="">جاري التحميل...</option>';if(!item||!site){source.innerHTML='<option value="">اختر الصنف والمخزن أولاً</option>';return}try{let q=sb.from('purchases').select('id,invoice_no,purchase_date').eq('site_id',site).eq('status','posted');if(supplier)q=q.eq('supplier_id',supplier);const p=await q.order('purchase_date',{ascending:false});if(p.error)throw p.error;const ids=(p.data||[]).map(x=>x.id);if(!ids.length){source.innerHTML='<option value="">لا توجد أذون شراء مرحّلة</option>';return}const l=await sb.from('purchase_lines').select('id,purchase_id,qty,unit_cost,tax_rate').eq('item_id',item).in('purchase_id',ids);if(l.error)throw l.error;source.innerHTML='<option value="">اختر إذن الشراء</option>';for(const x of (l.data||[])){const po=(p.data||[]).find(z=>z.id===x.purchase_id);if(!po)continue;const o=document.createElement('option');o.value=x.id;o.dataset.qty=x.qty;o.dataset.cost=x.unit_cost;o.dataset.tax=x.tax_rate||0;o.textContent=`${po.invoice_no||po.id.slice(0,8)} — ${po.purchase_date} — سعر ${Number(x.unit_cost||0).toFixed(2)} — ${Number(x.tax_rate||0)>0?Number(x.tax_rate).toFixed(2)+'%':'بدون ضريبة'}`;source.appendChild(o)}}catch(e){source.innerHTML='<option value="">تعذر تحميل الأذون</option>';console.error(e)}}function applySource(tr){const o=tr.querySelector('.source').selectedOptions[0],price=tr.querySelector('.price'),qty=tr.querySelector('.qty');if(!o?.value)return;price.value=Number(o.dataset.cost||0).toFixed(2);qty.max=o.dataset.qty||'';qty.title='الحد الأقصى من الإذن: '+(o.dataset.qty||0);tr.dataset.sourcePurchaseLineId=o.value;tr.dataset.sourceQty=o.dataset.qty||0;tr.dataset.sourceTax=o.dataset.tax||0;tr.querySelector('.tax').textContent=Number(o.dataset.tax||0)>0?Number(o.dataset.tax).toFixed(2)+'%':'بدون ضريبة';calcRow(tr)}function calcRow(tr){const q=Number(tr.querySelector('.qty').value||0),p=Number(tr.querySelector('.price').value||0),tax=Number(tr.dataset.sourceTax||0),v=q*p,t=v*tax/100;tr.querySelector('.taxValue').textContent=t.toFixed(2);tr.querySelector('.lineTotal').textContent=(v+t).toFixed(2);calcTotals()}function calcTotals(){let v=0,t=0;document.querySelectorAll('#lines tr').forEach(r=>{const q=Number(r.querySelector('.qty').value||0),p=Number(r.querySelector('.price').value||0),rate=Number(r.dataset.sourceTax||0);v+=q*p;t+=q*p*rate/100});$('subtotal').textContent=v.toFixed(2);$('taxTotal').textContent=t.toFixed(2);$('grandTotal').textContent=(v+t).toFixed(2)}function renumber(){document.querySelectorAll('#lines tr').forEach((r,i)=>r.querySelector('.num').textContent=i+1)}function show(s,c){$('msg').innerHTML=`<div class="msg ${c}">${esc(s)}</div>`}async function saveDraft(){try{const supplier=$('supplier').value,site=$('site').value;if(!supplier||!site)return show('اختر المورد والمخزن','bad');const rows=[...document.querySelectorAll('#lines tr')];if(!rows.length)return show('أضف صنفًا واحدًا على الأقل','bad');const data=rows.map(r=>({item_id:r.querySelector('.item').value,qty:Number(r.querySelector('.qty').value),unit_cost:Number(r.querySelector('.price').value),source_purchase_line_id:r.dataset.sourcePurchaseLineId||null}));if(data.some(x=>!x.item_id||!x.source_purchase_line_id||x.qty<=0))return show('اختر إذن الشراء الأصلي لكل صنف','bad');for(const x of data){const row=rows.find(r=>r.querySelector('.item').value===x.item_id&&r.dataset.sourcePurchaseLineId);if(row&&x.qty>Number(row.dataset.sourceQty||0))return show('الكمية أكبر من الكمية الموجودة في إذن الشراء','bad')}const subtotal=data.reduce((s,x)=>s+x.qty*x.unit_cost,0),tax=rows.reduce((s,r)=>s+Number(r.querySelector('.taxValue').textContent||0),0),total=subtotal+tax;const h=await sb.from('purchase_returns').insert({return_no:$('docno').value?Number($('docno').value):null,supplier_id:Number(supplier),site_id:site,return_date:$('date').value,total,status:'draft',created_by:user.id}).select().single();if(h.error)throw h.error;const l=await sb.from('purchase_return_lines').insert(data.map(x=>({return_id:h.data.id,item_id:x.item_id,qty:x.qty,unit_cost:x.unit_cost,source_purchase_line_id:x.source_purchase_line_id})));if(l.error)throw l.error;show('تم حفظ مردود المشتريات كمسودة ✓','ok');return h.data.id}catch(e){show(e.message||e,'bad')}}async function saveAndPost(){const id=await saveDraft();if(id)location.href='purchase-return-post.html?select='+encodeURIComponent(id)}init();</script></body></html>
