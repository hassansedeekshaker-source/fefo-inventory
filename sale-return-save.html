<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مرتجع مبيعات</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172033;font-family:Tahoma,Arial,sans-serif}
.wrap{width:100%;margin:0}.card{width:100%;min-height:calc(100vh - 10px);background:#fff;border:1px solid #dfe5ed;border-radius:8px;padding:14px}
.top{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.btn{padding:9px 14px;border:1px solid #d7dee8;border-radius:7px;background:#fff;color:#172033;text-decoration:none;cursor:pointer}
.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title h1{margin:0;font-size:30px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:700}input,select,textarea{width:100%;padding:9px;border:1px solid #ccd5e3;border-radius:7px;background:#fff;font-size:14px}textarea{min-height:38px;resize:vertical}.readonly{background:#f4f6fa}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1250px}th,td{border:1px solid #dfe5ed;padding:7px;text-align:center;white-space:nowrap}th{background:#eef2f7}td input,td select{min-width:75px;padding:7px}.add{margin:10px 0;padding:9px 14px;border:1px dashed #9aa7b8;border-radius:7px;background:#fff;cursor:pointer}
.totals{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}.total{border:1px solid #e0e5ec;border-radius:8px;padding:12px;text-align:center;background:#fafbfd}.total b{display:block;margin-bottom:6px}.num{font-size:19px;font-weight:700}.net{background:#eef7f2}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{padding:10px 16px;border:0;border-radius:7px;cursor:pointer}.save{background:#087f4f;color:#fff}.post{background:#18243a;color:#fff}.msg{margin-top:12px;padding:10px;border-radius:7px}.okmsg{background:#e5f7ee;color:#087f4f}.badmsg{background:#fdecec;color:#b42318}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.totals{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="top"><a class="btn" href="accounting.html">🏠 الرئيسية</a><a class="btn" href="sales.html">↩ المبيعات</a><a class="btn" href="sale-return-save.html?saved=1">📋 المرتجعات المحفوظة</a><a class="btn" href="sale-return-post.html">📤 الترحيل</a></div>
<div class="card"><div class="title"><h1>مرتجع مبيعات</h1><span>مرتجع عميل</span></div>
<div class="grid"><div class="field"><label>رقم المرتجع</label><input id="docno" placeholder="يُنشأ تلقائيًا"></div><div class="field"><label>التاريخ</label><input id="date" type="date"></div><div class="field"><label>المخزن</label><select id="site"></select></div><div class="field"><label>العميل</label><select id="customer"></select></div></div>
<div class="table-wrap"><table><thead><tr><th>الصنف</th><th>الوحدة</th><th>الكمية</th><th>سعر البيع</th><th>الرصيد</th><th>التكلفة</th><th>إجمالي التكلفة</th><th>نسبة الخصم</th><th>قيمة الخصم</th><th>القيمة</th><th>نسبة الضريبة</th><th>قيمة الضريبة</th><th>الإجمالي</th><th>حذف</th></tr></thead><tbody id="lines"></tbody></table></div>
<button class="add" onclick="addLine()">＋ إضافة بند</button>
<div class="totals"><div class="total"><b>تكلفة المرتجع</b><div class="num" id="costTotal">0.00</div></div><div class="total"><b>قيمة الخصم</b><div class="num" id="discountTotal">0.00</div></div><div class="total"><b>قيمة المرتجع</b><div class="num" id="valueTotal">0.00</div></div><div class="total"><b>قيمة الضريبة</b><div class="num" id="taxTotal">0.00</div></div><div class="total net"><b>إجمالي المرتجع</b><div class="num" id="grandTotal">0.00</div></div></div>
<div class="actions"><button class="save" onclick="saveReturn()">💾 حفظ مسودة</button><button class="post" onclick="location.href='sale-return-post.html'">📤 الترحيل</button><button class="btn" onclick="window.print()">🖨 طباعة</button><button class="btn" onclick="location.href='sale-return-save.html'">📄 مرتجع جديد</button></div><div id="msg"></div>
</div></div>
<script>
const URL='https://fyqyodnboryzaejlhdlk.supabase.co',KEY='sb_publishable_7-Gz455HgXsWpS_5jrJ71A_VwHCEho2',sb=supabase.createClient(URL,KEY);
let user,items=[],units=[],sites=[],customers=[];
const $=id=>document.getElementById(id), today=()=>new Date().toISOString().slice(0,10);
function opt(a,label){return '<option value="">-- اختر --</option>'+a.map(x=>'<option value="'+x.id+'">'+String(label(x)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))+'</option>').join('')}
async function init(){
 $('date').value=today();
 addLine();
 try{
  const s=await sb.auth.getSession();
  if(!s.data.session){location.href='accounting.html';return}
  user=s.data.session.user;

  const results=await Promise.allSettled([
   sb.from('inv_items').select('id,name_ar,unit_id,purchase_price,sale_price,tax_rate').eq('active',true).order('name_ar'),
   sb.from('inv_units').select('id,name_ar').order('name_ar'),
   sb.from('inv_sites').select('id,name_ar').eq('active',true).order('name_ar'),
   sb.from('customers').select('id,name,withholding_enabled,withholding_rate').order('name'),
   sb.from('inventory_costs').select('item_id,site_id,qty_on_hand,weighted_avg_cost')
  ]);

  const a=results[0].status==='fulfilled'?results[0].value:null;
  const b=results[1].status==='fulfilled'?results[1].value:null;
  const c=results[2].status==='fulfilled'?results[2].value:null;
  const d=results[3].status==='fulfilled'?results[3].value:null;
  const e=results[4].status==='fulfilled'?results[4].value:null;

  if(a?.data) items=a.data;
  if(b?.data) units=b.data;
  if(c?.data) sites=c.data;
  if(d?.data) customers=d.data;
  window.costRows=e?.data||[];

  $('site').innerHTML=opt(sites,x=>x.name_ar);
  $('customer').innerHTML=opt(customers,x=>x.name);

  const p=new URLSearchParams(location.search);
  if(p.get('customer_id')) $('customer').value=p.get('customer_id');
  if(p.get('site_id')) $('site').value=p.get('site_id');

  const errs=results.filter(r=>r.status==='fulfilled' && r.value?.error).map(r=>r.value.error.message);
  if(errs.length) show('تم فتح الشاشة، لكن يوجد خطأ في تحميل بعض البيانات: '+errs.join(' | '),'badmsg');
  else if(!items.length) show('الشاشة تعمل، لكن لا توجد أصناف مُفعّلة حاليًا.','badmsg');
 }catch(e){
  show('تعذر تحميل البيانات: '+(e.message||e),'badmsg');
 }
}
function addLine(){const tr=document.createElement('tr');tr.innerHTML='<td><select class="item" onchange="itemChange(this)">'+opt(items,x=>x.name_ar)+'</select></td><td class="unit">-</td><td><input class="qty" type="number" min=".001" step=".001" value="1" oninput="calc()"></td><td><input class="price" type="number" min="0" step=".01" value="0" oninput="calc()"></td><td><input class="stock readonly" readonly value="0.00"></td><td><input class="cost readonly" readonly value="0.00"></td><td class="linecost">0.00</td><td><input class="disc" type="number" min="0" max="100" step=".01" value="0" oninput="calc()"></td><td class="discvalue">0.00</td><td class="value">0.00</td><td><input class="tax readonly" readonly value="0.00"></td><td class="taxvalue">0.00</td><td class="linetotal">0.00</td><td><button onclick="this.closest('tr').remove();calc()">🗑</button></td>';$('lines').appendChild(tr);itemChange(tr.querySelector('.item'))}
async function itemChange(el){const tr=el.closest('tr'),x=items.find(i=>String(i.id)===String(el.value));if(!x)return;tr.querySelector('.unit').textContent=(units.find(u=>String(u.id)===String(x.unit_id))||{}).name_ar||'-';tr.querySelector('.price').value=Number(x.sale_price||0).toFixed(2);tr.querySelector('.tax').value=Number(x.tax_rate||0).toFixed(2);tr.querySelector('.cost').value=Number(x.purchase_price||0).toFixed(2);tr.querySelector('.stock').value='0.00';const site=$('site').value;const r=(window.costRows||[]).find(z=>String(z.item_id)===String(x.id)&&String(z.site_id)===String(site));if(r){tr.querySelector('.stock').value=Number(r.qty_on_hand||0).toFixed(3);tr.querySelector('.cost').value=Number(r.weighted_avg_cost||x.purchase_price||0).toFixed(2)}calc()}
$('site').addEventListener('change',()=>document.querySelectorAll('.item').forEach(itemChange));
$('customer').addEventListener('change',calc);
function calc(){let c=0,d=0,v=0,t=0,g=0;document.querySelectorAll('#lines tr').forEach(tr=>{const q=+tr.querySelector('.qty').value||0,p=+tr.querySelector('.price').value||0,dr=+tr.querySelector('.disc').value||0,rate=+tr.querySelector('.tax').value||0,co=+tr.querySelector('.cost').value||0,gross=q*p,dd=gross*dr/100,net=gross-dd,tx=net*rate/100;c+=q*co;d+=dd;v+=net;t+=tx;g+=net+tx;tr.querySelector('.linecost').textContent=(q*co).toFixed(2);tr.querySelector('.discvalue').textContent=dd.toFixed(2);tr.querySelector('.value').textContent=net.toFixed(2);tr.querySelector('.taxvalue').textContent=tx.toFixed(2);tr.querySelector('.linetotal').textContent=(net+tx).toFixed(2)});$('costTotal').textContent=c.toFixed(2);$('discountTotal').textContent=d.toFixed(2);$('valueTotal').textContent=v.toFixed(2);$('taxTotal').textContent=t.toFixed(2);$('grandTotal').textContent=g.toFixed(2)}
async function saveReturn(){try{const customer=$('customer').value,site=$('site').value;if(!customer||!site)return show('اختار العميل والمخزن','badmsg');const rows=[...document.querySelectorAll('#lines tr')];if(!rows.length)return show('أضف صنفًا واحدًا على الأقل','badmsg');const rs=rows.map(tr=>{const x=items.find(i=>String(i.id)===String(tr.querySelector('.item').value));const q=+tr.querySelector('.qty').value||0,p=+tr.querySelector('.price').value||0,d=+tr.querySelector('.disc').value||0,rate=+tr.querySelector('.tax').value||0,co=+tr.querySelector('.cost').value||0,g=q*p,dd=g*d/100,n=g-dd;return{item_id:x.id,qty:q,unit_price:p,unit_cost:co,discount_rate:d,discount_amount:dd,tax_rate:rate,tax_amount:n*rate/100}});if(rs.some(x=>!x.item_id||x.qty<=0))return show('راجع الأصناف والكميات','badmsg');const subtotal=rs.reduce((s,x)=>s+x.qty*x.unit_price-x.discount_amount,0),discount_total=rs.reduce((s,x)=>s+x.discount_amount,0),tax=rs.reduce((s,x)=>s+x.tax_amount,0),total=subtotal+tax,cust=customers.find(x=>String(x.id)===String(customer)),wr=cust?.withholding_enabled?Number(cust.withholding_rate||0):0,withholding=total*wr/100;const h=await sb.from('sales_returns').insert({customer_id:+customer,site_id:site,return_date:$('date').value,subtotal,discount_total,tax,total,withholding_tax:withholding,status:'draft',created_by:user.id}).select().single();if(h.error)throw h.error;const l=await sb.from('sales_return_lines').insert(rs.map(x=>({...x,return_id:h.data.id})));if(l.error)throw l.error;$('docno').value=h.data.return_no||h.data.id.slice(0,8);show('تم حفظ مرتجع المبيعات كمسودة ✓','okmsg')}catch(e){show(e.message||e,'badmsg')}}
function show(s,c){$('msg').className='msg '+c;$('msg').textContent=s}
document.addEventListener('DOMContentLoaded',init);
</script>
</body></html>
